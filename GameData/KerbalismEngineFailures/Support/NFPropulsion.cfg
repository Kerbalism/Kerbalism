@PART[ionArgon-*]:HAS[@MODULE[ModuleEngines*]]:NEEDS[NearFuturePropulsion,FeatureReliability]:AFTER[KerbalismEngineFailures]
{
	@MODULE[EngineFailures]
	{
		@rated_operation_duration = 0
		@turnon_failure_probability = 0.002
		@repair = Engineer@2
	}
}

