// ============================================================================
// Add EngineFailures module to supported engine parts
// ============================================================================

// Strip legacy engine Reliability modules from Kerbalism core when this
// companion is installed (editor/new vessels). In-flight saves keep their
// serialized modules until the vessel is rebuilt.
@PART[*]:HAS[@MODULE[Reliability]:HAS[#type[ModuleEngines*]]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	!MODULE[Reliability]:HAS[#type[ModuleEngines*]] {}
}

@PART[*]:HAS[@MODULE[ModuleEngines*],!MODULE[ModuleEnginesRF],!MODULE[EngineFailures]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	MODULE
	{
		name = EngineFailures
		title = #KERBALISM_Reliability_title_Engine
		redundancy = Propulsion
		repair = Engineer
		extra_cost = 1.5
		extra_mass = 0.05
		engine_reliability_auto = true
		engine_reliability_family = auto
		turnon_failure_probability = -2
		rated_operation_duration = -2
		rated_ignitions = -2
	}
}

// NERV
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[LiquidFuel]]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	@MODULE[EngineFailures]
	{
		@repair = Engineer@2
	}
}

// your standard garden variety rocket engine
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[Oxidizer]]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	@MODULE[EngineFailures]
	{
		@repair = true
	}
}

// ion engines
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[XenonGas]]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	@MODULE[EngineFailures]
	{
		@repair = Engineer@2
	}
}

// jet engines
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[IntakeAir]]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	@MODULE[EngineFailures]
	{
		@repair = true
	}
}

// hypergolic or monoprop engines
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[MonoPropellant]]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	@MODULE[EngineFailures]
	{
		@repair = true
	}
}

@PART[*]:HAS[@MODULE[ModuleEnginesRF],!MODULE[EngineFailures]]:NEEDS[FeatureReliability]:FOR[KerbalismEngineFailures]
{
	MODULE
	{
		name = EngineFailures
		title = #KERBALISM_Reliability_title_Engine
		redundancy = Propulsion
		repair = Engineer
		extra_cost = 1.0
		extra_mass = 0.1
		engine_reliability_auto = false
		turnon_failure_probability = -1
		rated_operation_duration = 12000
		rated_ignitions = -1
	}
}
