    //
    //Контракты // "Contracts"
    //
    #KERBALISM_Contracts_radTitle = Пересечь радиационный пояс // "Cross the radiation belt"
    #KERBALISM_Contracts_radDesc = Один блестящий учёный предсказал два пояса сверхзаряженных частиц, окружающих планету. Теперь нам нужно подтвердить их существование и выяснить, насколько они смертоносны на самом деле. // "A brilliant scientist predicted two belts of super-charged particles surrounding the planet. Now we need to confirm their existence and find out how deadly they really are."
    #KERBALISM_Contracts_radComplete = Миссия подтвердила наличие двух радиационных поясов вокруг планеты. Предварительные данные указывают на чрезвычайно высокий уровень радиации. // "The mission confirmed the presence of two radiation belts around the planet. Early data suggest extreme levels of radiation."
    #KERBALISM_Contracts_heliopauseTitle = Пересечь гелиопаузу // "Cross the heliopause"
    #KERBALISM_Contracts_heliopauseDesc = Что там, за гелиопаузой? По правде говоря, мы не знаем. Вот тут-то вы и нужны. // "What is out there, beyond the heliopause? The truth is, we don't know. That's where you come in."
    #KERBALISM_Contracts_heliopauseComplete = Мы зашли так далеко, что разум отказывается это осознавать. За гелиопаузой находятся чудеса межзвёздного пространства и ещё больше радиации. // "We went so far the mind doesn't comprehend it. Beyond the heliopause there are the wonders of interstellar space, and more radiation."
    #KERBALISM_Contracts_orbitTitle = Удерживать пилотируемый корабль на орбите 30 дней // "Keep a crewed vessel in orbit for 30 days"
    #KERBALISM_Contracts_orbitDesc = Выход на орбиту оказался проще, чем мы ожидали. Теперь пришло время удерживать пилотируемый корабль на орбите в течение 30 дней. // "Obtaining an orbit was easier than we expected. Now it is time to keep a crewed vessel in orbit for 30 days."
    #KERBALISM_Contracts_orbitComplete = Миссия прошла успешно, хотя экипажу было немного скучно. У нас есть множество данных о длительном пребывании в космосе. // "The mission was a success, albeit the crew is a bit bored. We have plenty of data about long-term permanence in space."
    #KERBALISM_Contracts_foodTitle = Произвести еду в космосе // "Produce food in space"
    #KERBALISM_Contracts_foodDesc = Теперь, когда у нас есть технология выращивания еды в космосе, нам стоит её испытать. Произведите еду в оранжерее в космосе. // "Now that we got the technology to grow food in space, we should probably test it. Produce food from a greenhouse in space."
    #KERBALISM_Contracts_foodComplete = Мы произвели еду в космосе, и наши учёные говорят, что она действительно вкусная. // "We produced food in space, and our scientists says it is actually delicious."
    #KERBALISM_Contracts_sampleTitle = Проанализировать образцы в космосе // "Analyze samples in space"
    #KERBALISM_Contracts_sampleDesc = Лаборатория может анализировать образцы в космосе, в теории. Стоит проверить, работает ли это на самом деле, проанализировав несколько образцов в космосе. // "The Laboratory can analyze samples in space, in theory. We should check if this actually work by and analyzing some samples in space."
    #KERBALISM_Contracts_sampleComplete = Наш лабораторный анализ был хорош, возможно, даже лучше, чем тот, который обычно проводят наши учёные в центре управления. Но не говорите им. // "Our Laboratory analysis was good, perhaps even better than the ones done usually by our scientists at mission control. But don't tell'em."
