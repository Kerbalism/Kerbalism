// ============================================================================
// Coatl Aerospace (ProbesPlus / GroundOps) - Kerbalism science support
//
// Convert Coatl ModuleScienceExperiment / DMModuleScienceAnimateGeneric instruments
// to Kerbalism Experiment. Science points follow Coatl ScienceDefs baseValue.
// Data size = stock baseValue * dataScale (Mb). EC is modest (original parts had none).
//
// Multi-experiment parts (mer_rsp, ca_sciBoom, ca_vor_camera, ca_stereoBoom, …) keep
// one Experiment module per experimentID — simultaneous slots on the same part.
//
// DMOS remaps (magScan / rpwsScan / scopeScan on DM* modules) stay handled by
// DMagicOrbitalScience_Science.cfg. Without DMOS, ca_mag converts to stock
// magnetometer. This file covers remaining ca_* IDs and MSE+scopeScan leftovers
// after Coatl's DMagicOrbitalScience.cfg remaps.
// ============================================================================

@KERBALISM_EXPERIMENT_VALUES:NEEDS[FeatureScience]
{
	CoatlAerospace
	{
		// ScienceDefs: baseValue * dataScale → size; value = baseValue
		ca_gammaRay
		{
			ECCost = 0.05
			size = 6
			value = 6
			duration = 600								// 10 min
			requirements =
			ResourceRates =
		}
		ca_rpws
		{
			ECCost = 0.08
			size = 14
			value = 7
			duration = 1800								// 30 min
			requirements =
			ResourceRates =
		}
		ca_orbitalScope
		{
			ECCost = 0.05
			size = 18
			value = 6
			duration = 900								// 15 min
			requirements = SunAngleMax:55
			ResourceRates =
		}
		// ca_mag → stock magnetometer (same as DMOS magScan handling)
		ca_IRspec
		{
			ECCost = 0.04
			size = 6
			value = 6
			duration = 600								// 10 min
			requirements = SunAngleMax:55
			ResourceRates =
		}
		ca_UVspec
		{
			ECCost = 0.04
			size = 6
			value = 6
			duration = 600								// 10 min
			requirements = SunAngleMax:55
			ResourceRates =
		}
		ca_ionElec
		{
			ECCost = 0.04
			size = 5
			value = 5
			duration = 480								// 8 min
			requirements =
			ResourceRates =
		}
		ca_solarWind
		{
			ECCost = 0.06
			size = 6
			value = 6
			duration = 1200								// 20 min
			requirements =
			ResourceRates =
		}
		ca_kdex
		{
			ECCost = 0.03
			size = 20
			value = 10
			duration = 720								// 12 min
			requirements =
			ResourceRates =
		}
		ca_micrometeoroid
		{
			ECCost = 0.02
			size = 6
			value = 6
			duration = 3600								// 60 min (passive impacts)
			requirements =
			ResourceRates =
		}
		ca_SiteSurvey
		{
			ECCost = 0.04
			size = 6
			value = 6
			duration = 300								// 5 min
			requirements =
			ResourceRates =
		}
		ca_soilScoop
		{
			ECCost = 0.05
			size = 6
			value = 6
			duration = 480								// 8 min
			requirements =
			ResourceRates =
		}
	}
}

// ============================================================================
// Replace science modules → Experiment (one patch per experimentID)
// Parts with several Coatl experiments get several Experiment modules.
// ============================================================================

@PART[*]:HAS[@MODULE:HAS[#experimentID[ca_gammaRay]]]:NEEDS[FeatureScience]
{
	MODULE
	{
		name = Experiment
		experiment_id = ca_gammaRay
		anim_deploy = #$../MODULE:HAS[#experimentID[ca_gammaRay],~name[Experiment]]/animationName$
		allow_shrouded = False
	}
	!MODULE:HAS[#experimentID[ca_gammaRay],~name[Experiment]] {}
}

@PART[*]:HAS[@MODULE:HAS[#experimentID[ca_rpws]]]:NEEDS[FeatureScience]
{
	MODULE
	{
		name = Experiment
		experiment_id = ca_rpws
		anim_deploy = #$../MODULE:HAS[#experimentID[ca_rpws],~name[Experiment]]/animationName$
		allow_shrouded = False
	}
	!MODULE:HAS[#experimentID[ca_rpws],~name[Experiment]] {}
}

@PART[*]:HAS[@MODULE:HAS[#experimentID[ca_orbitalScope]]]:NEEDS[FeatureScience]
{
	MODULE
	{
		name = Experiment
		experiment_id = ca_orbitalScope
		allow_shrouded = False
	}
	!MODULE:HAS[#experimentID[ca_orbitalScope],~name[Experiment]] {}
}

// Vorona camera ships with experimentID=scopeScan (DMOS id) even without DMOS.
// Without DMOS: map onto ca_orbitalScope. With DMOS: keep scopeScan after Coatl remaps.
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[scopeScan]]]:NEEDS[FeatureScience,!DMagicOrbitalScience]
{
	MODULE
	{
		name = Experiment
		experiment_id = ca_orbitalScope
		allow_shrouded = False
	}
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[scopeScan]] {}
}

@PART[*]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[scopeScan]]]:NEEDS[FeatureScience,DMagicOrbitalScience]:AFTER[DMagicOrbitalScience]
{
	MODULE
	{
		name = Experiment
		experiment_id = scopeScan
		allow_shrouded = False
	}
	!MODULE[ModuleScienceExperiment]:HAS[#experimentID[scopeScan]] {}
}

