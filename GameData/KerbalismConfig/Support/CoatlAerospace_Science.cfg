// MSE remapped to scopeScan: ensure rates exist (DM* conversions already set theirs).
@PART[*]:HAS[@MODULE[Experiment]:HAS[#experiment_id[scopeScan]]]:NEEDS[DMagicOrbitalScience,FeatureScience]:FOR[KerbalismDefault]
{
	@MODULE[Experiment]:HAS[#experiment_id[scopeScan]]
	{
		%ec_rate = 0.05
		%requires = SunAngleMax:55
		%data_rate = #$@KERBALISM_EXPERIMENT_VALUES/DMagicOrbitalScience/scopeScan/size$
		@data_rate /= #$@KERBALISM_EXPERIMENT_VALUES/DMagicOrbitalScience/scopeScan/duration$
	}
}

// ============================================================================
// Scale ScienceDefs + Kerbalism situations (from Coatl situationMask / biomeMask)
// ============================================================================

@EXPERIMENT_DEFINITION:HAS[#id[ca_gammaRay]]:NEEDS[FeatureScience]:FOR[zzzKerbalismDefault]
{
	@baseValue = #$@KERBALISM_EXPERIMENT_VALUES/CoatlAerospace/ca_gammaRay/value$
	@scienceCap = #$baseValue$
	@dataScale = #$@KERBALISM_EXPERIMENT_VALUES/CoatlAerospace/ca_gammaRay/size$
	@dataScale /= #$baseValue$

	KERBALISM_EXPERIMENT
	{
		Situation = InSpaceLow
		Situation = InSpaceHigh
	}
}

