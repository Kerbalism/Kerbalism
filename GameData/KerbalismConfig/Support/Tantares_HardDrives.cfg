// ============================================================================
// Progressive HardDrive sizes for Tantares / TantaresSP / TantaresLV (#912)
// data = baseline Mb (subject to stock capacity upgrades)
// samples = sample slots
// Deprecated / hidden ModuleCommand parts are left on the global default.
// ============================================================================


@KERBALISM_HDD_SIZES:NEEDS[FeatureScience,Tantares]:BEFORE[KerbalismDefault]
{
	Tantares
	{
		// --- Early crew / probes (Vostok / Zenit) ---
		AndromedaCrew			// start, 1-seat
		{
			data = 0.5
			samples = 1
		}
		AndromedaCrew2			// survivability, 2-seat
		{
			data = 1
			samples = 2
		}
		AndromedaAvionics		// start probe avionics
		{
			data = 2
			samples = 0
		}
		AndromedaControlCore	// Zenit recoverable photo bus
		{
			data = 4
			samples = 0
		}

		// --- Crewed spacecraft ---
		SoyuzCrew				// flightControl ~ Gemini / MK2Pod
		{
			data = 11.5
			samples = 4
		}
		LkCrew					// landing
		{
			data = 8
			samples = 4
		}
		LkAvionics				// metaMaterials
		{
			data = 46
			samples = 0
		}
		LokCrew					// advFlightControl
		{
			data = 16
			samples = 4
		}
		Lk700Crew				// advLanding ~ MEM
		{
			data = 26
			samples = 8
		}
		VaCrew					// commandModules ~ MK1-3
		{
			data = 32
			samples = 6
		}
		VaAvionics
		{
			data = 16
			samples = 0
		}

		// --- Stations / modules ---
		FgbAirlock
		{
			data = 16
			samples = 3
		}
		FgbNode
		{
			data = 22
			samples = 4
		}
		FgbControl
		{
			data = 46
			samples = 0
		}
		FgbAdapter				// secondary command adapters
		{
			data = 4
			samples = 1
		}
		FgbTug
		{
			data = 32
			samples = 0
		}
		Almaz
		{
			data = 40
			samples = 6
		}
		Salyut
		{
			data = 56
			samples = 8
		}
		Mir
		{
			data = 80
			samples = 10
		}
		MirAdapter
		{
			data = 8
			samples = 2
		}
		SoforaControl
		{
			data = 8
			samples = 0
		}
		Progress
		{
			data = 16
			samples = 0
		}
		Cupola
		{
			data = 22
			samples = 0
		}

		// --- Late probes / MEK ---
		Meteor
		{
			data = 100
			samples = 0
		}
		Polyus
		{
			data = 200
			samples = 0
		}
		MekAscent
		{
			data = 32
			samples = 6
		}
		MekPilot
		{
			data = 128
			samples = 4
		}
		MekAvionics
		{
			data = 200
			samples = 0
		}

		// --- Generic Castor cores (size progression) ---
		CastorS0
		{
			data = 16
			samples = 0
		}
		CastorS0p5
		{
			data = 25
			samples = 0
		}
		CastorS1
		{
			data = 32
			samples = 0
		}
	}
}

@KERBALISM_HDD_SIZES:NEEDS[FeatureScience,TantaresSP]:BEFORE[KerbalismDefault]
{
	TantaresSP
	{
		// Planetary probe ladder: PS-1 鈫?YE 鈫?MV 鈫?1F
		Ps1
		{
			data = 1
			samples = 0
		}
		Ye1a
		{
			data = 2
			samples = 0
		}
		Ye2a
		{
			data = 4
			samples = 0
		}
		MvEarly					// 1MV / 3MV
		{
			data = 8
			samples = 0
		}
		MvMid					// 4MV / 4MV-VL
		{
			data = 32
			samples = 0
		}
		Ye8						// Lunokhod bus
		{
			data = 64
			samples = 0
		}
		Ye85Ascent				// tiny sample-return rocket core
		{
			data = 4
			samples = 0
		}
		Ye85Bus
		{
			data = 32
			samples = 0
		}
		Ye85Container			// return capsule + command
		{
			data = 2
			samples = 6
		}
		Mv1F					// Phobos-class
		{
			data = 100
			samples = 0
		}

		// Dedicated science containers (no ModuleCommand 鈥?HardDrive added below)
		Container3mv
		{
			data = 8
			samples = 4
		}
		Container4mv
		{
			data = 16
			samples = 6
		}
		Container1f
		{
			data = 32
			samples = 8
		}
	}
}

@KERBALISM_HDD_SIZES:NEEDS[FeatureScience,TantaresLV]:BEFORE[KerbalismDefault]
{
	TantaresLV
	{
		// Upper-stage avionics only 鈥?keep small so they are not free expanders
		Fregat
		{
			data = 4
			samples = 0
		}
		BlokD
		{
			data = 8
			samples = 0
		}
	}
}


