// ============================================================================
// KerbalismProcessPlannerCleanup.cfg
// Remove leftover planner UI and reliability modules after stock modules are replaced.
// ============================================================================

@PART[FuelCell|FuelCellArray]:HAS[@MODULE[ProcessController],!MODULE[ModuleResourceConverter]]:NEEDS[Kerbalism,ProfileDefault]:AFTER[KerbalismDefault]
{
	!MODULE[PlannerController],* {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}
}

@PART[strl-worldpower-sth*]:HAS[!MODULE[ModuleResourceConverter]]:NEEDS[Kerbalism,SterlingSystems]:AFTER[Kerbalism]
{
	!MODULE[PlannerController]:HAS[#plannerId[converter]],* {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}
}

// :HAS has no OR, so each alternative sets a flag and the work is keyed on the flag.
@PART[*]:HAS[@MODULE[ProcessController]]:NEEDS[Kerbalism]:LAST[KerbalismBridge90Cleanup]
{
	%kerbalismHasProcessController = true
}

@PART[*]:HAS[@MODULE[ProcessControllerSystemHeat]]:NEEDS[Kerbalism]:LAST[KerbalismBridge90Cleanup]
{
	%kerbalismHasProcessController = true
}

@PART[*]:HAS[#kerbalismHasProcessController[true],!MODULE[ModuleResourceConverter]]:NEEDS[Kerbalism]:LAST[KerbalismBridge90Cleanup]
{
	!MODULE[PlannerController]:HAS[#plannerId[converter]],* {}
	!MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}
}

@PART[*]:HAS[#kerbalismHasProcessController[true],!MODULE[ModuleGenerator]]:NEEDS[Kerbalism]:LAST[KerbalismBridge90Cleanup]
{
	!MODULE[PlannerController]:HAS[#plannerId[generator]],* {}
	!MODULE[Reliability]:HAS[#type[ModuleGenerator]],* {}
}

@PART[*]:HAS[#kerbalismHasProcessController[true]]:NEEDS[Kerbalism]:LAST[KerbalismBridge90Cleanup]
{
	!kerbalismHasProcessController = delete
}
