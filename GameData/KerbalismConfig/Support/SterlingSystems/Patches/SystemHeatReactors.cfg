// Sterling reactors -> ProcessController + SystemHeat.

@PART[strl-rctrms-*]:NEEDS[Kerbalism,SystemHeat,SterlingSystems]:FOR[Kerbalism]
{
	@tags ^= :$: _kerbalism

	flowWH = 65
	@flowWH *= #$/refPower$

	!MODULE[ModuleSystemHeatConverter],* {}
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[SystemHeatConverterKerbalism],* {}
	!MODULE[ModuleOverheatDisplay] {}
	!MODULE[ModuleCoreHeat] {}

	MODULE
	{
		name = ProcessController
		resource = _MSR
		title = #LOC_strl_reactor_fission
		capacity = #$/refPower$
	}
	MODULE:NEEDS[CommunityResourcePack]
	{
		name = ProcessController
		resource = _BreederMSR
		title = Tritium Breeder MSR
		capacity = #$/refPower$
	}

	MODULE
	{
		name = Configure
		title = Sterling Molten Salt Reactor
		slots = 1
		reconfigure = engineer@5
		SETUP
		{
			name = MSR
			desc = The standard nuclear salt reaction.
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _MSR
			}
		}
		SETUP:NEEDS[CommunityResourcePack]
		{
			name = Breeder MSR
			desc = The standard nuclear salt reaction with a molten Lithium breeding curtain.
			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _BreederMSR
			}
		}
	}

	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = ProcessController
		title = Molten Salt Reactor
		repair = Engineer
		mtbf = 72576000
		extra_cost = 1.0
		extra_mass = 0.2
	}
}

