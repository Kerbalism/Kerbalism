// Reactors

@PART[strl-rctrms*]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[Kerbalism]
{
	MODULE
	{
		name = Emitter
		radiation = #$/mass$
		@radiation != 0.85
		@radiation *= 2.77778E-05
	}
}

@PART[strl-rctrpb*]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[Kerbalism]
{
	MODULE
	{
		name = Emitter
		radiation = #$/mass$
		@radiation != 0.8
		@radiation *= 2.77778E-05
	}
}

// BVG
@PART[strl-rctrbv??]:NEEDS[ProfileDefault]:FOR[Kerbalism]
{
	!MODULE[ModuleGenerator] {}
	MODULE
	{
		name = ProcessController
		resource = _BVG
		title = #KERBALISM_BranchLoc_BVG_050366
		capacity = 0.125
		running = true
		toggle = false
	}
}
@PART[strl-rctrbv02]:NEEDS[ProfileDefault]:FOR[Kerbalism]
{
	@MODULE[ProcessController]:HAS[#resource[?BVG]]
	{
		@capacity = 0.375
	}
}
@PART[strl-rctrbv03]:NEEDS[ProfileDefault]:FOR[Kerbalism]
{
	@MODULE[ProcessController]:HAS[#resource[?BVG]]
	{
		@capacity = 0.75
	}
}
@PART[strl-rctrbv04]:NEEDS[ProfileDefault]:FOR[Kerbalism]
{
	@MODULE[ProcessController]:HAS[#resource[?BVG]]
	{
		@capacity = 1.5
	}
}


// Engines

// Solid-core NTR
@PART[strl-eng-*-suleu]:HAS[!MODULE[Emitter]]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[Kerbalism]
{
	MODULE
	{
		name = Emitter
		radiation = #$/mass$
		@radiation *= 0.00005 // rad/s
	}
}

// Closed-cycle gas-core NTR
@PART[strl-eng-375-ccgc]:HAS[!MODULE[Emitter]]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[Kerbalism]
{
	MODULE
	{
		name = Emitter
		radiation = #$/mass$
		@radiation *= 0.0001 // rad/s
	}
}

// Open-cycle gas-core NTR (vents with exhaust)
@PART[strl-eng-375-ocgc]:HAS[!MODULE[Emitter]]:NEEDS[FeatureRadiation,SterlingSystems]:FOR[Kerbalism]
