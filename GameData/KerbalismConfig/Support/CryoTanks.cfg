// ============================================================================
// CryoTanks.cfg
// Kerbalism support patch for CryoTanks - PiezPiedPy 21st June 2018
// Edited by DangerNoodle9000 July 2026


KERBALISM_CRYO_SETTINGS
{
	Enabled = true
}


//   LH2 added to radial containers.
//   Hydrogen Liquefaction process for creating LqdHydrogen from Hydrogen gas.
//   Liquid Hydrogen Evaporator process for creating Hydrogen gas from LqdHydrogen.
//   LH2+O2 Fuel Cells.



// ============================================================================
// Add resources and processes to the KerbalismSupport profile
// ============================================================================
Profile
{
	name = KerbalismSupport
	modname = CryoTanks
	moddir = CryoTanks

	Supply
	{
		resource = LqdHydrogen
		low_message = #KERBALISM_BranchLoc_LH2_is_almost_depleted_on_VESSEL
		empty_message = #KERBALISM_BranchLoc_There_is_no_more_LH2_on_VESSEL
		refill_message = #KERBALISM_BranchLoc_LH2_storage_refilled_on_VESSEL
	}

	Supply
	{
		resource = LqdMethane
		low_message = #KERBALISM_BranchLoc_LCH4_is_almost_depleted_on_VESSEL
		empty_message = #KERBALISM_BranchLoc_There_is_no_more_LCH4_on_VESSEL
		refill_message = #KERBALISM_BranchLoc_LCH4_storage_refilled_on_VESSEL
	}

	// convention: 1 capacity = enough to liquify the output of 1 electrolyzer
	// Liquefaction energy: ~6.5 kWh/kg for H₂ at industrial scale

	// ksp units are volume at standard pressure (different substances have different standard volumes sometimes)
	// 1 unit hydrogen ^= 1l hydrogen at STP (density matches)
	// 1 unit liquid hydrogen ^= 1l lH2 at 1 bar and 20K
	// 1 EC = 1 kJ = 0.2778 Wh
	Process
	{
		name = h2 to lh2 converter
		modifier = _H2Converter
		input = Hydrogen@1.1			// 1.1 l/s = 0.00009889 kg/s
		input = ElectricCharge@46.8		// 6.5 kWh/kg * 0.00009889 kg = 0.000643 kWh = 0.643 Wh = 2.32 EC
		output = LqdHydrogen@0.00139576570219	// 1.1 l/s * (0.0899/70.85) = 0.00139576570219 l/s
	}

	// Vaporization process - phase change from liquid to gas
	// Energy needed to heat H₂ from cryogenic temp (-253°C) to ambient temp (20°C)
	// Specific heat of H₂: ~14.3 kJ/(kg·K), ΔT = 273K
	// latent heat of vaporisation: 446 kJ/kg = 0.892 kJ/mol
	// total energy: ~4350 kJ/kg
	Process
	{
		name = lh2 to h2 converter
		modifier = _LH2Converter
		input = LqdHydrogen@0.0014			// 0.0014 l/s = 0.00009919 kg/s
		input = ElectricCharge@0.43			// ~4350 kJ/kg * 0.00009919 kg ~= 0.43 kJ = 0.43 EC
		output = Hydrogen@1.10333704116
	}


    // 1 capacity = enough to liquify the output of 1 sabatier
    // liquefaction energy ~0.6 kWh/kg
    // source: https://websites.fraunhofer.de/Cometh-Wiki/index.php/Liquified_Natural_Gas_-_LNG
    Process
    {
        name = ch4 to lch4 converter
        modifier = _CH4Converter
        input = Methane@3.46196019              // 3.46 l/s = 0.00248 kg/s
        input = ElectricCharge@5.36160698546    // 0.6 kWh/kg * 0.00248 kg = 0.00149 kWh = 5.36 kJ = 5.36 EC
        output = LqdMethane@0.00583215962085
    }


    // vaporisation energy: latent heat of vaportisation: 8.19 kJ/mol + isobaric heat capacity: 35.8 J/(mol K), over deltaT of ~160 K
    // total: 13.918 kJ/mol, with CH4 molar mass: 0.01604 kg/mol -> 867.7 kJ/kg
    Process
    {
        name = lch4 to ch4 converter
        modifier = _LCH4Converter
        input = LqdMethane@0.00583215962085		// 0.0058 l/s = 0.00248 kg/s
        input = ElectricCharge@2.15384126557    // 0.00248 kg/s * 867.7 kJ/kg = 2.15 kJ/s = 2.15 EC/s
        output = Methane@3.46196019 
    }



	// same values as stock kerbalism sabatier process, except the methane output
	Process
	{
		name = CO2 methanation
		modifier = _CO2Methanation
		specialist_bonus = true
		input = ElectricCharge@0.008082126 	// calculated using 3.256 J/(g K) (sustained heating to 575K)
		input = CarbonDioxide@3.490273221
		input = Hydrogen@13.87826691
		output = Water@0.005574954
		output = Methane@3.46196019		// liquid methane -> 0.00583215962085
		dump_valve = Water,LqdMethane
	}

	// source: https://ntrs.nasa.gov/archive/nasa/casi.ntrs.nasa.gov/20100036570.pdf
	// scaled to match sabatier output
	// total reaction enthalpy ~= 95 kJ/mol -> should consume 14.74 EC/s -> 2.5m ISRU would use ~1300 EC/s
	// lets leave it at 9 EC for now
	Process
	{
		name = methane pyrolosis
		modifier = _CH4Pyrolosis
		specialist_bonus = true
		input = ElectricCharge@9.0		    // 2.5 Wh ÷ 0.2778 ≈ 9.0 EC (Higher energy for thermal decomposition)
		input = Methane@3.46196019		    // 1 mol CH₄ (16 g/mol), scaled to sabatier output -> ~0.155 mol/s
		output = Hydrogen@6.90274042333		// 2 mol H₂ (2 g/mol), ~0.31 mol/s -> 0.62 g/s -> 6.9 l/s
		output = Carbon@0.000886509091511	// 1 mol C (12 g/mol), ~ 0.155 mol/s -> 1.86 g/s -> 0.0009 l/s
		dump_valve = Carbon,Hydrogen
	}


	// why do we even need this if its the same as sabatier but less efficient?
	// maybe for higher throughput per ISRU?
    // added 4x throughput

	//  source: https://pdfs.semanticscholar.org/9159/213d6ad79bd800d07525bc37463588742662.pdf
	//  Reverse Water-Gas Shift: CO₂ + H₂ → CO + H₂O, then CO + 3H₂ → CH₄ + H₂O
	//  Overall: CO₂ + 4H₂ → CH₄ + 2H₂O (same as Sabatier but at higher temperature)
	Process
	{
		name = SE-RWGS
		modifier = _RWGS
		specialist_bonus = true
		input = ElectricCharge@0.064657008 	// 4x sabatier throughput at 8x power consumption
		input = CarbonDioxide@13.961092884
		input = Hydrogen@55.51306764
		output = Water@0.022299816
		output = Methane@13.84784076	// liquid methane -> 0.0233286384834
		dump_valve = LqdMethane,Water
	}



	// do we even want this because dedicated greenhouses exist already
	// TODO needs fixing plus debate if necessary
    // i just commented this out because kerbalism already has greenhouses

	//  source: https://ntrs.nasa.gov/archive/nasa/casi.ntrs.nasa.gov/20190031739.pdf
	//  Photosynthesis: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂
	//  Simplified for game: 2 CO₂ + 2 H₂O → O₂ + biomass
//	Process
//	{
//		name = algae bioreactor
//		modifier = _algae
//		specialist_bonus = true
//		input = ElectricCharge@1.8		// 0.5 Wh ÷ 0.2778 ≈ 1.8 EC (Energy for artificial lighting and pumps)
//		input = CarbonDioxide@0.044		// 1 mol CO₂ (44 g/mol)
//		input = WasteWater@0.018		// 1 mol H₂O (18 g/mol)
//		output = Oxygen@0.016			// 0.5 mol O₂ (32 g/mol)
//		output = Water@0.009			// 0.5 mol clean H₂O (18 g/mol)
//		output = Food@0.025				// Biomass equivalent (simplified)
//		dump_valve = Oxygen,Water,Food,Oxygen&Water,Oxygen&Food,Water&Food,Oxygen&Water&Food
//	}

	// Hydrogen fuel cell: 2H₂ + O₂ → 2H₂O + electrical energy
	// Theoretical energy: 286 kJ/mol H₂O, efficiency ~60% in practice
	Process
	{
		name = lqd hydrogen fuel cell
		modifier = _LH2FuelCell
		input = LqdHydrogen@0.0564573041637		// 2 mol H₂ (2 g/mol each), 0.004 kg/s -> ~0.056 l/s
		input = Oxygen@22.695035461			    // 1 mol O₂ (32 g/mol), 0.032 kg/s -> ~22.7 l/s
		output = Water@0.036		        	// 2 mol H₂O (18 g/mol each), 0.036 kg/s -> ~0.036 l/s
		output = ElectricCharge@343	        // 2 * 286 kJ/mol * 0.6 efficiency ≈ 343 kJ = 343 EC
		dump = Water
	}
}


// ============================================================================
// Add LqdHydrogen to radial containers
// ============================================================================
@PART[kerbalism-container-radial-*]:HAS[@MODULE[Configure]:HAS[!SETUP[Liquid?Hydrogen]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	@MODULE[Configure]
	{
		SETUP
		{
			name = #KERBALISM_BranchLoc_Liquid_Hydrogen
			desc = #KERBALISM_BranchLoc_Store_Liquid_Hydrogen
			tech = advFuelSystems

			RESOURCE
			{
				name = LqdHydrogen
				amount = 1
				maxAmount = 1
				@amount *= #$/ContainerVolume$
				@maxAmount *= #$/ContainerVolume$
			}
		}
	}
}


// ============================================================================
// Add LH2 cooling to radial containers
// ============================================================================
@PART[kerbalism-container-radial-*]:HAS[@MODULE[Configure]:HAS[@SETUP[Liquid?Hydrogen]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	MODULE
	{
		name =  ModuleCryoTank
		// in Ec per 1000 units per second
		CoolingCost = 0.05
		CoolingEnabled = True
		BOILOFFCONFIG
		{
			FuelName = LqdHydrogen
			// in % per hr
			BoiloffRate = 0.05
		}
	}
}


// ============================================================================
// Add Hydrogen liquefaction and evaporation to ISRU chemical plants
// ============================================================================
@PART[kerbalism-chemicalplant,MiniISRU,ISRU]:HAS[@MODULE[Configure]:HAS[!SETUP[h2?to?lh2?converter]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	MODULE
	{
		name = ProcessController
		resource = _H2Converter
		title = #KERBALISM_BranchLoc_Hydrogen_liquefaction
		capacity = 4
		running = true
	}

	@MODULE[Configure]
	{
		SETUP
		{
			name = #KERBALISM_BranchLoc_Hydrogen_liquefaction
			desc = #KERBALISM_BranchLoc_Liquefy_Hydrogen_gas_into_Liquid_Hydrogen
			tech = advFuelSystems

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _H2Converter
			}

			RESOURCE
			{
			    name = Hydrogen
			    amount = 0
			    maxAmount = 4500
			}
		}
	}
}

@PART[kerbalism-chemicalplant,MiniISRU,ISRU]:HAS[@MODULE[Configure]:HAS[!SETUP[LH2?to?H2?Converter]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
