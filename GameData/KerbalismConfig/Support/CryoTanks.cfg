// ============================================================================
// Cryo tank Kerbalism updaters (EC + background boiloff via IKerbalismModule)
// ============================================================================
@PART[*]:HAS[@MODULE[ModuleCryoTank],!MODULE[CryoTankKerbalismUpdater]]:NEEDS[CryoTanks,ProfileDefault]:LAST[KerbalismBridge00Integration]
{
	MODULE
	{
		name = CryoTankKerbalismUpdater
	}
}

// PlannerController: module-level CoolingCost > 0 (legacy CryoTanks configs)
@PART[*]:HAS[@MODULE[ModuleCryoTank]:HAS[#CoolingCost[>0],#CoolingEnabled[*],~CoolingAllowed[*alse]],!MODULE[PlannerController]]:NEEDS[CryoTanks,ProfileDefault]:LAST[KerbalismBridge00Integration]
{
	MODULE
	{
		name = PlannerController
		title = #KERBALISM_Brokers_Cryotank
		considered = #$/MODULE[ModuleCryoTank]:HAS[#CoolingCost[>0],#CoolingEnabled[*],~CoolingAllowed[*alse],0/CoolingEnabled$
	}
}

@PART[*]:HAS[@MODULE[ModuleCryoTank]:HAS[#CoolingCost[>0],~CoolingEnabled[],~CoolingAllowed[*alse]],!MODULE[PlannerController]]:NEEDS[CryoTanks,ProfileDefault]:LAST[KerbalismBridge00Integration]
{
	MODULE
