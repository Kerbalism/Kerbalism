// ============================================================================
// CryoTanks.cfg
// Kerbalism support patch for CryoTanks - PiezPiedPy 21st June 2018
// Edited by DangerNoodle9000 July 2026


KERBALISM_CRYO_SETTINGS
{
	Enabled = true
}


//   LH2 added to radial containers.
//   Hydrogen Liquefaction process for creating LqdHydrogen from Hydrogen gas.
//   Liquid Hydrogen Evaporator process for creating Hydrogen gas from LqdHydrogen.
//   LH2+O2 Fuel Cells.


// ============================================================================
// Add resources and processes to the KerbalismSupport profile
// ============================================================================
Profile
{
	name = KerbalismSupport
	modname = CryoTanks
	moddir = CryoTanks

	Supply
	{
		resource = LqdHydrogen
		low_message = #KERBALISM_BranchLoc_LH2_is_almost_depleted_on_VESSEL
		empty_message = #KERBALISM_BranchLoc_There_is_no_more_LH2_on_VESSEL
		refill_message = #KERBALISM_BranchLoc_LH2_storage_refilled_on_VESSEL
	}

	Supply
	{
		resource = LqdMethane
		low_message = #KERBALISM_BranchLoc_LCH4_is_almost_depleted_on_VESSEL
		empty_message = #KERBALISM_BranchLoc_There_is_no_more_LCH4_on_VESSEL
		refill_message = #KERBALISM_BranchLoc_LCH4_storage_refilled_on_VESSEL
	}

	// All rates are resource units/s at capacity 1; density is tonnes/unit.
	// Phase changes use q_out = q_in * density_in / density_out (CRP).
	// EC budgets below assume 1 EC = 1 kJ for phase-change equipment only.
	// Fuel cells retain the Default profile's gameplay energy scale.

	// Match one Default water electrolyzer, including its engineer multiplier.
	// H2 density = 8.99e-8 t/u; LH2 density = 7.085e-5 t/u.
	// Liquefaction budget: 6.5 kWh/kg = 23400 kJ/kg.
	Process
	{
		name = h2 to lh2 converter
		modifier = _H2Converter
		specialist_bonus = true
		input = Hydrogen@1.0011122892
		input = ElectricCharge@2.10599987829847
		output = LqdHydrogen@0.00127028927027636
	}

	// Same mass flow in reverse; heating/vaporization budget: 4350 kJ/kg.
	Process
	{
		name = lh2 to h2 converter
		modifier = _LH2Converter
		specialist_bonus = true
		input = LqdHydrogen@0.00127028927027636
		input = ElectricCharge@0.391499977375998
		output = Hydrogen@1.0011122892
	}

	// Optional methane phase changes from #1120. Integrated production below
	// still outputs liquid fuel, so existing vessels need no extra process slot.
	// CH4 density = 7.17e-7 t/u; LCH4 density = 4.2561e-4 t/u.
	// Match one Sabatier's methane mass flow; liquefaction budget: 0.6 kWh/kg.
	Process
	{
		name = ch4 to lch4 converter
		modifier = _CH4Converter
		specialist_bonus = true
		input = Methane@3.46196019
		input = ElectricCharge@5.3616069854568
		output = LqdMethane@0.00583215962085007
	}

	// Vaporization/heating budget: 867.7 kJ/kg.
	Process
	{
		name = lch4 to ch4 converter
		modifier = _LCH4Converter
		specialist_bonus = true
		input = LqdMethane@0.00583215962085007
		input = ElectricCharge@2.15382702837077
		output = Methane@3.46196019
	}

	// CO2 + 4 H2 -> CH4 + 2 H2O. Keep Default Sabatier's reactant
	// and water rates, with equal-mass liquid methane instead of abstract LF.
	// EC = Default Sabatier (0.008082126) + methane liquefaction.
	Process
	{
		name = CO2 methanation
		modifier = _CO2Methanation
		specialist_bonus = true
		input = ElectricCharge@5.3696891114568
		input = CarbonDioxide@3.490273221
		input = Hydrogen@13.87826691
		output = Water@0.005574954
		output = LqdMethane@0.00583215962085007
		dump_valve = Water,LqdMethane
	}

	// CH4 -> C + 2 H2. Retain the historical process/modifier names for saves.
	// Molar masses: CH4 16.04246, C 12.0107, H2 2.01588 g/mol.
	// Match methanation's methane mass flow. Processing budget: 95 kJ/mol
	// plus liquid feed vaporization/heating, using #1120's energy assumptions.
	Process
	{
		name = methane pyrolosis
		modifier = _CH4Pyrolosis
		specialist_bonus = true
		input = ElectricCharge@16.8530326577973
		input = LqdMethane@0.00583215962085007
		output = Hydrogen@6.93913345688153
		output = Carbon@0.000884951123074453
		dump_valve = Carbon,Hydrogen
	}

	// Legacy combined RWGS + methanation route: same net chemistry/throughput
	// as Sabatier. Keep #1120's 2x reaction-processing EC per unit throughput,
	// plus the same liquefaction cost; do not introduce a 4x production buff.
	Process
	{
		name = SE-RWGS
		modifier = _RWGS
		specialist_bonus = true
		input = ElectricCharge@5.3777712374568
		input = CarbonDioxide@3.490273221
		input = Hydrogen@13.87826691
		output = Water@0.005574954
		output = LqdMethane@0.00583215962085007
		dump_valve = LqdMethane,Water
	}

	// Retain the legacy algae setup for existing craft/saves. Model dry Food
	// as carbohydrate CH2O: CO2 + 2 H2O -> CH2O + O2 + H2O.
	// WasteWater is treated as water feed by mass (density 0.001005 t/u).
	// Food density = 0.00028102905982906 t/u. One capacity supplies one
	// Default eating rule (0.1312141885 Food / 10800 s), before engineer bonus.
	// The 1.8 EC/s lighting/pumping budget is a gameplay assumption.
	Process
	{
		name = algae bioreactor
		modifier = _algae
		specialist_bonus = true
		input = ElectricCharge@1.8
		input = CarbonDioxide@0.00256507606336548
		input = WasteWater@0.00000407676833655218
		output = Oxygen@0.00258062952771487
		output = Water@0.00000204857608911747
		output = Food@0.0000121494618981481
		dump_valve = Oxygen,Water,Food,Oxygen&Water,Oxygen&Food,Water&Food,Oxygen&Water&Food
	}

	// Equal mass, water yield and EC output to Default's gas-H2 fuel cell.
	// Only the H2 input changes phase. A separate real-world heat-value scale
	// here would create energy gains when paired with Default electrolysis.
	Process
	{
		name = lqd hydrogen fuel cell
		modifier = _LH2FuelCell
		input = LqdHydrogen@0.00127028927027636
		input = Oxygen@0.5065967413
		output = Water@0.0008043014
		output = ElectricCharge@2.4026694940
		dump = Water
	}
}


// ============================================================================
// Add LqdHydrogen to radial containers
// ============================================================================
@PART[kerbalism-container-radial-*]:HAS[@MODULE[Configure]:HAS[#configureId[SupplyContainer],!SETUP[*]:HAS[@RESOURCE[LqdHydrogen]]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	@MODULE[Configure]:HAS[#configureId[SupplyContainer]]
	{
		SETUP
		{
			name = #KERBALISM_BranchLoc_Liquid_Hydrogen
			desc = #KERBALISM_BranchLoc_Store_Liquid_Hydrogen
			tech = advFuelSystems

			RESOURCE
			{
				name = LqdHydrogen
				amount = 1
				maxAmount = 1
				@amount *= #$/ContainerVolume$
				@maxAmount *= #$/ContainerVolume$
			}
		}
	}
}

@PART[kerbalism-container-radial-*]:HAS[@MODULE[Configure]:HAS[#configureId[PressurizedTank],!SETUP[*]:HAS[@RESOURCE[LqdHydrogen]]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	@MODULE[Configure]:HAS[#configureId[PressurizedTank]]
	{
		SETUP
		{
			name = #KERBALISM_BranchLoc_Liquid_Hydrogen
			desc = #KERBALISM_BranchLoc_Store_Liquid_Hydrogen
			tech = advFuelSystems

			RESOURCE
			{
				name = LqdHydrogen
				amount = 1
				maxAmount = 1
				@amount *= #$/ContainerVolume$
				@maxAmount *= #$/ContainerVolume$
			}
		}
	}
}


// ============================================================================
// Add LH2 cooling to radial containers
// ============================================================================
@PART[kerbalism-container-radial-*]:HAS[@MODULE[Configure]:HAS[@SETUP[*]:HAS[@RESOURCE[LqdHydrogen]]],!MODULE[ModuleCryoTank]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	MODULE
	{
		name =  ModuleCryoTank
		// in Ec per 1000 units per second
		CoolingCost = 0.05
		CoolingEnabled = True
		BOILOFFCONFIG
		{
			FuelName = LqdHydrogen
			// in % per hr
			BoiloffRate = 0.05
		}
	}
}


// ============================================================================
// Add Hydrogen liquefaction and evaporation to ISRU chemical plants
// ============================================================================
@PART[kerbalism-chemicalplant,MiniISRU,ISRU]:HAS[@MODULE[Configure]:HAS[#configureId[ChemicalPlant]],!MODULE[ProcessController*]:HAS[#resource[_H2Converter]]]:NEEDS[CryoTanks,ProfileDefault]:AFTER[zzz_CryoTanks]
{
	MODULE
	{
		name = ProcessController
		resource = _H2Converter
		title = #KERBALISM_BranchLoc_Hydrogen_liquefaction
		capacity = 1
		running = true
	}

	@MODULE[Configure]:HAS[#configureId[ChemicalPlant]]
	{
		SETUP
		{
			name = #KERBALISM_BranchLoc_Hydrogen_liquefaction
			desc = #KERBALISM_BranchLoc_Liquefy_Hydrogen_gas_into_Liquid_Hydrogen
			tech = advFuelSystems

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _H2Converter
			}

			RESOURCE
			{
			    name = Hydrogen
			    amount = 0
			    maxAmount = 4500
			}
		}
	}
}

