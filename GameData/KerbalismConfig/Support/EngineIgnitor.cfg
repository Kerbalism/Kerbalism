// When EngineIgnitor is present (and KiwiTechTree is not), disable
// KerbalismEngineFailures on engine parts. Core Kerbalism Reliability stays.
@PART[*]:HAS[@MODULE[ModuleEngines*]]:NEEDS[EngineIgnitor,!KiwiTechTree,KerbalismEngineFailures]:AFTER[KerbalismEngineFailures]
{
	!MODULE[EngineFailures],* {}
}
