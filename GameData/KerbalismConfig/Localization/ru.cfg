		// Названия НАУЧНЫХ НАСТРОЕК (стандартные названия приборов; эксперименты Kerbalism используют ключи EXPERIMENT_*) // "Science SETUP titles (stock instrument names; Kerbalism experiments reuse EXPERIMENT_* keys)"
		#KERBALISM_SETUP_2HOTThermometer_title = Термометр 2HOT // "2HOT Thermometer"
		#KERBALISM_SETUP_DoubleCSeismicAccelerometer_title = Сейсмический акселерометр Double-C // "Double-C Seismic Accelerometer"
		#KERBALISM_SETUP_MaterialsBayStudy_title = Исследование материаловедческого отсека // "Materials Bay Study"
		#KERBALISM_SETUP_MysteryGooObservation_title = Наблюдение таинственной субстанции // "Mystery Goo Observation"
		#KERBALISM_SETUP_GRAVMAX_title = Детектор отрицательных гравиоли GRAVMAX // "GRAVMAX Negative Gravioli Detector"
		#KERBALISM_SETUP_PresMatBarometer_title = Барометр PresMat // "PresMat Barometer"
		#KERBALISM_SETUP_AtmosphericFluidSpectroVariometer_title = Атмосферный жидкостный спектро-вариометр // "Atmospheric Fluid Spectro-Variometer"
		#KERBALISM_SETUP_TelemetryReport_desc = Позволяет ядру зонда отправлять данные телеметрии. // "Allows the probe core to send back telemetry data."
		#KERBALISM_SETUP_2HOTThermometer_desc = Устанавливает термометр 2HOT в блок научных приборов, позволяя проводить температурные сканирования. // "Installs the 2HOT Thermometer on the Science Instrument Unit, allowing you to perform temperature scans."
		#KERBALISM_SETUP_GeigerCounter_desc = Устанавливает счётчик Гейгера в блок научных приборов, позволяя проводить сканирования радиации. // "Installs the Geiger Counter on the Science Instrument Unit, allowing you to perform radiation scans."
		#KERBALISM_SETUP_DoubleCSeismicAccelerometer_desc = Устанавливает сейсмический акселерометр Double-C в блок научных приборов, позволяя проводить сейсмические сканирования. // "Installs the Double-C Seismic Accelerometer on the Science Instrument Unit, allowing you to perform seismic scans."
		#KERBALISM_SETUP_MaterialsBayStudy_desc = Устанавливает материаловедческий отсек SC-9001 Science Jr. в лабораторию, позволяя учёным на борту изучать поведение "материалов" в различных средах. // "Install a SC-9001 Science Jr. Materials Bay in the Laboratory, allowing on-board scientists to study the behaviour of "materials" in different environments."
		#KERBALISM_SETUP_MysteryGooObservation_desc = Устанавливает блок с таинственной субстанцией в лабораторию, позволяя учёным на борту изучать поведение субстанции в различных средах. // "Install a Mystery Goo Containment Unit in the Laboratory, allowing on-board scientists to study the behaviour of the Goo in different environments."
		#KERBALISM_SETUP_FishSpeciesObservation_title = Наблюдение за видами рыб // "Fish Species Observation"
		#KERBALISM_SETUP_FishSpeciesObservation_desc = Устанавливает аквариум в лабораторию, позволяя наблюдать за поведением рыб в различных средах. Не забывайте их иногда кормить! // "Installs a Fish Tank in the Laboratory, allowing you to observe their behavior in different environments. Don't forget to feed them once in a while!"
		#KERBALISM_SETUP_GRAVMAX_desc = Устанавливает детектор отрицательных гравиоли GRAVMAX в блок научных приборов, позволяя кораблю проводить гравиметрические сканирования. // "Installs the GRAVMAX Negative Gravioli Detector on the Science Instrument Unit, allowing the vessel to perform gravimetric scans."
		#KERBALISM_SETUP_PresMatBarometer_desc = Устанавливает барометр PresMat. // "Installs the PresMat Barometer."
		#KERBALISM_SETUP_AtmosphericFluidSpectroVariometer_desc = Устанавливает атмосферный жидкостный спектро-вариометр. // "Installs the Atmospheric Fluid Spectro-Variometer"
		#KERBALISM_SETUP_AtmosphericScience_desc = Настраивает деталь как научный прибор, позволяя выбирать атмосферные инструменты. // "Configures the part as a science instrument, allowing for a selection of atmospheric instruments."
		#KERBALISM_SETUP_UnderwaterScience_desc = Настраивает деталь как научный прибор, позволяя выбирать подводные эксперименты. // "Configures the part as a science instrument, allowing for a selection of underwater experiments."
		#KERBALISM_SETUP_AtmosphericHarvester_desc = Настраивает деталь как атмосферный добытчик, позволяя добывать ресурсы из атмосферы. // "Configures the part as an atmospheric harvester, allowing for extraction of resources from the atmosphere."

