		#KERBALISM_climatization_danger = $ON_VESSEL$KERBAL замерзает|$ON_VESSEL$KERBAL горит заживо // "$ON_VESSEL$KERBAL is freezing|$ON_VESSEL$KERBAL is burning alive"
		#KERBALISM_climatization_fatal = $ON_VESSEL$KERBAL замёрз насмерть|$ON_VESSEL$KERBAL сгорел заживо // "$ON_VESSEL$KERBAL froze to death|$ON_VESSEL$KERBAL was burned alive"
		#KERBALISM_climatization_relax = Гипотермия $ON_VESSEL$KERBAL под контролем|$ON_VESSEL$KERBAL обнимает климатизатор // "$ON_VESSEL$KERBAL hypothermia is under control|$ON_VESSEL$KERBAL is hugging the climatizer"

		#KERBALISM_food_warning = $ON_VESSEL$KERBAL голоден // "$ON_VESSEL$KERBAL is hungry"
		#KERBALISM_food_danger = $ON_VESSEL$KERBAL голодает // "$ON_VESSEL$KERBAL is starving"
