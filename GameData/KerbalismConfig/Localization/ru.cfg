		#KERBALISM_BranchLoc_Hydrogen_and_CarbonDioxide_react_with_a_nickel_c = <b>Водород</b> и <b>Углекислый газ</b> реагируют с никелевым катализатором с образованием <b>Воды</b> и <b>Метана</b>. // "<b>Hydrogen</b> and <b>CarbonDioxide</b> react with a nickel catalyst to produce <b>Water</b> and <b>Methane</b>."
		#KERBALISM_BranchLoc_HydrazineProduction = Производство гидразина // "Hydrazine Production"
		#KERBALISM_BranchLoc_Produce_LqdAmmonia_from_LqdHydrogen_and_LqdNitro = Производит <b>Жидкий аммиак</b> из <b>Жидкого водорода</b> и <b>Жидкого азота</b>. // "Produce <b>LqdAmmonia</b> from <b>LqdHydrogen</b> and <b>LqdNitrogen</b>."
		#KERBALISM_BranchLoc_Convert_LqdAmmonia_into_MonoPropellant_and_LqdHy = Превращает <b>Жидкий аммиак</b> в <b>Монопропеллент</b> и <b>Жидкий водород</b>. // "Convert <b>LqdAmmonia</b> into <b>MonoPropellant</b> and <b>LqdHydrogen</b>."
		#KERBALISM_BranchLoc_Create_Glykerol_from_Water_and_Carbon = Создаёт <b>Гликерол</b> из <b>Воды</b> и <b>Углерода</b>. // "Create <b>Glykerol</b> from <b>Water</b> and <b>Carbon</b>."
		#KERBALISM_BranchLoc_Fuse_Carbon_and_Oxygen_into_CarbonDioxide = Синтезирует <b>Углерод</b> и <b>Кислород</b> в <b>Углекислый газ</b>. // "Fuse <b>Carbon</b> and <b>Oxygen</b> into <b>CarbonDioxide</b>."
		#KERBALISM_BranchLoc_Extract_Carbon_and_Oxygen_out_of_CarbonDioxide = Извлекает <b>Углерод</b> и <b>Кислород</b> из <b>Углекислого газа</b>. // "Extract <b>Carbon</b> and <b>Oxygen</b> from <b>CarbonDioxide</b>."
		#KERBALISM_BranchLoc_Produce_CarbonMonoxide_and_Oxygen_from_CarbonDio = Производит <b>Угарный газ</b> и <b>Кислород</b> из <b>Углекислого газа</b>. // "Produce <b>CarbonMonoxide</b> and <b>Oxygen</b> from <b>CarbonDioxide</b>."
		#KERBALISM_BranchLoc_Produce_CarbonMonoxide_and_Hydrogen_from_Carbon = Производит <b>Угарный газ</b> и <b>Водород</b> из <b>Углерода</b> и <b>Воды</b>. // "Produce <b>CarbonMonoxide</b> and <b>Hydrogen</b> from <b>Carbon</b> and <b>Water</b>."
		#KERBALISM_BranchLoc_Extract_ArgonGas_Oxygen_Water_and_XenonGas_out_of_ore = Извлекает <b>Газообразный аргон</b>, <b>Кислород</b>, <b>Воду</b> и <b>Газообразный ксенон</b> из <b>Гидратов</b>. // "Extract <b>ArgonGas</b>, <b>Oxygen</b>, <b>Water</b>, and <b>XenonGas</b> from <b>Hydrates</b>."
		#KERBALISM_BranchLoc_Extract_Carbon_and_Hydrogen_from_Methane = Извлекает <b>Углерод</b> и <b>Водород</b> из <b>Метана</b>. // "Extract <b>Carbon</b> and <b>Hydrogen</b> from <b>Methane</b>."
		#KERBALISM_BranchLoc_Extract_pure_Oxygen_and_Carbon_out_of_Ore = Извлекает чистый <b>Кислород</b> и <b>Углерод</b> из <b>Руды</b>. // "Extract pure <b>Oxygen</b> and <b>Carbon</b> from <b>Ore</b>."
		#KERBALISM_BranchLoc_Extract_Hydrogen_and_Oxygen_out_of_Water = Извлекает <b>Водород</b> и <b>Кислород</b> из <b>Воды</b>. // "Extract <b>Hydrogen</b> and <b>Oxygen</b> from <b>Water</b>."
		#KERBALISM_BranchLoc_Mix_Waret_Minerals_and_Slug_to_make_Konkrete = Смешивает <b>Воду</b>, <b>Минералы</b> и <b>Шлак</b> для производства <b>Бетона</b>. // "Mix <b>Water</b>, <b>Minerals</b>, and <b>Slug</b> to make <b>Konkrete</b>."
		#KERBALISM_BranchLoc_Melt_Rock_to_make_Konkrete_similar_to_the_LaveHi = Плавит <b>Породу</b> для производства <b>Бетона</b>, аналогично системе LavaHive(TM). // "Melt <b>Rock</b> to make <b>Konkrete</b>, similar to the LavaHive(TM) system."
		#KERBALISM_BranchLoc_Squeeze_Water_from_Ore_title = Выжимает воду из руды. // "Squeeze Water from Ore."
		#KERBALISM_BranchLoc_Produce_Coolant_from_Ore_Water_and_Minerals_to_c = Производит <b>Охлаждающую жидкость</b> из <b>Руды</b>, <b>Воды</b> и <b>Минералов</b> для охлаждения радиаторов. // "Produce <b>Coolant</b> from <b>Ore</b>, <b>Water</b>, and <b>Minerals</b> for radiator cooling."
