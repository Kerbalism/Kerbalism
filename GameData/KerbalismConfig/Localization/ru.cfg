		// Локализация деталей // "Parts Localization"

		// ****** Названия вариантов // "Variant names"
		#kerbalism-variant-white = Белый // "White"
		#kerbalism-variant-green = Зелёный // "Green"
		#kerbalism-variant-black-and-white = Чёрно-белый // "Black and White"
		#kerbalism-variant-orange = Оранжевый // "Orange"

		// ********** Деталь: kerbalism-activeshield
		#kerbalism-activeshield_Part_description = Создаёт магнитное поле вокруг корабля, снижая входящую радиацию. Эффект значителен только в отношении уровней радиации, встречающихся в межпланетных полётах, и почти не даст эффекта внутри поясов сверхзаряженных частиц или во время солнечных бурь. // "Generate a magnetic field around the vessel, reducing incoming radiation. The effect is significant only in relation to the radiation levels encountered in interplanetary flight, and will do little to nothing inside super-charged particle belts or during solar storms."
		#kerbalism-activeshield_Part_manufacturer = Мастерские TripleZeta // "TripleZeta Workshops"
		#kerbalism-activeshield_Part_title = Активная защита // "Active Shield"

		// ********** Деталь: kerbalism-antenna
		#kerbalism-antenna_Part_description = Разработана давно молодым и вдохновлённым Вернером фон Керманом, до того как его внимание переключилось на разработку оружия массового уничтожения. // "Designed long ago by a young and inspired Wernher von Kerman, before his focus shifted to the development of weapons of mass destruction."
		#kerbalism-antenna_Part_manufacturer = Ионная Симфоническая Протонная Электроника // "Ionic Symphonic Protonic Electronics"
		#kerbalism-antenna_Part_title = Communotron 8 // "Communotron 8"

		// ********** Деталь: kerbalism-chemicalplant
		#kerbalism-chemicalplant_Part_description = Универсальный химический завод, который помещается в небольшом служебном отсеке. Любое сходство с Convert-O-Tron является чисто случайным. // "A versatile chemical plant that can fit in the small service bay. Any similarities with the Convert-O-Tron is purely coincidental."
		#kerbalism-chemicalplant_Part_manufacturer = Rookies Inc. // "Rookies Inc."
		#kerbalism-chemicalplant_Part_title = Химический завод // "Chemical Plant"

		// ********** Деталь: kerbalism-container-inline-0625
		#kerbalism-container-inline-0625_Part_description = Достойная альтернатива голодной смерти. // "A valid alternative to starving."
		#kerbalism-container-inline-0625_Part_manufacturer = Nazari Storage Services // "Nazari Storage Services"
		#kerbalism-container-inline-0625_Part_title = Контейнер снабжения, 0.625 м // "Supply Container, 0.625m"

		// ********** Деталь: kerbalism-container-inline-125
		#kerbalism-container-inline-125_Part_description = Один из парней в JPL предложил простую и гениальную идею: большие контейнеры для хранения большего количества припасов. После пары тысяч человеко-месяцев и 300 миллионов финансирования прототип был готов к ранним испытаниям. // "One of the guys at JPL had a simple and brilliant idea: bigger containers to store more supplies. After a couple thousands man-months and 300M in fundings, the prototype was ready for early testing."
		#kerbalism-container-inline-125_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-inline-125_Part_title = Контейнер снабжения, 1.25 м // "Supply Container, 1.25m"

		// ********** Деталь: kerbalism-container-inline-250
		#kerbalism-container-inline-250_Part_description = После экстравагантных излишеств предыдущего поколения космических контейнеров для припасов, финансовый отдел был не очень доволен финансированием разработки ещё большего. Когда один из клерков пожаловался на обоснованность "отправки людей в космос ради самого процесса", JPL перешла в военный режим и шантажом заставила всех причастных бюрократов подчиниться. И проект был одобрен со всей серьёзностью. // "After the extravagant excesses of the previous generation of space-grade supply containers, the fiscal department wasn't very happy of funding development of an even bigger one. When one of the clerks complained about the rationale behind 'putting men in space for the sake of it', JPL switched to war-mode and blackmailed all bureaucrats involved into submission. And the project was approved in the earnest."
		#kerbalism-container-inline-250_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-inline-250_Part_title = Контейнер снабжения, 2.5 м // "Supply Container, 2.5m"

		// ********** Деталь: kerbalism-container-inline-375
		#kerbalism-container-inline-375_Part_description = С самого начала было ясно, что 3.75 м — идеальный размер для миссий в дальний космос, но стоимость разработки была запретительной. Неожиданное решение пришло, когда однажды парни в мастерской попытались собрать Большой Контейнер Снабжения по неправильным чертежам. // "It was clear from the beginning that 3.75m was the ideal size for deep space missions, but the design cost was prohibitive. The unexpected solution came when one day the guys at the workshop tried to assemble a Big Supply Container using wrong drawings."
		#kerbalism-container-inline-375_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-inline-375_Part_title = Контейнер снабжения, 3.75 м // "Supply Container, 3.75m"

		// ********** Деталь: kerbalism-container-radial-huge
		#kerbalism-container-radial-huge_Part_description = Действительно огромный герметичный бак, который можно крепить радиально. // "A really huge pressurized tank that can be attached radially."
		#kerbalism-container-radial-huge_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-radial-huge_Part_title = Герметичный бак, Огромный // "Pressurized Tank, Huge"

		// ********** Деталь: kerbalism-container-radial-big
		#kerbalism-container-radial-big_Part_description = Большой герметичный бак, который можно крепить радиально. // "A big pressurized tank that can be attached radially."
		#kerbalism-container-radial-big_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-radial-big_Part_title = Герметичный бак, Большой // "Pressurized Tank, Big"

		// ********** Деталь: kerbalism-container-radial-medium
		#kerbalism-container-radial-medium_Part_description = Герметичный бак, который можно крепить радиально. // "A pressurized tank that can be attached radially."
		#kerbalism-container-radial-medium_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-radial-medium_Part_title = Герметичный бак // "Pressurized Tank"

		// ********** Деталь: kerbalism-container-radial-small
		#kerbalism-container-radial-small_Part_description = Малый герметичный бак, который можно крепить радиально. // "A small pressurized tank that can be attached radially."
		#kerbalism-container-radial-small_Part_manufacturer = Tygoo Transport Solutions // "Tygoo Transport Solutions"
		#kerbalism-container-radial-small_Part_title = Герметичный бак, Малый // "Pressurized Tank, Small"

		// ********** Деталь: kerbalism-container-radial-box-prosemian-large
		#kerbalism_container_box_large_Part_title = Ящик для припасов системы жизнеобеспечения, большой // "Life Support Supply Box, large"
		#kerbalism_container_box_large_Part_description = Большой ящик для различных припасов. Достаточно велик для больших экипажей и длительных миссий. // "A large box for various supplies. Big enough for larger crews and longer missions."

		// ********** Деталь: kerbalism-container-radial-box-prosemian-normal
		#kerbalism_container_box_normal_Part_title = Ящик для припасов системы жизнеобеспечения, обычный // "Life Support Supply Box, normal"
		#kerbalism_container_box_normal_Part_description = Ящик подходящего размера для различных припасов, идеален в ожидании спасательной миссии. // "A adequately sized box for various supplies, ideal when waiting for a rescue mission."

		// ********** Деталь: kerbalism-container-radial-box-prosemian-small
		#kerbalism_container_box_small_Part_title = Ящик для припасов системы жизнеобеспечения, малый // "Life Support Supply Box, small"
		#kerbalism_container_box_small_Part_description = Индивидуальный ящик для различных припасов. Не предназначен для совместного использования с другими членами экипажа. // "A individually sized box for various supplies. Not to be shared with other crew members."

		// ********** Деталь: kerbalism-geigercounter
		#kerbalism-geigercounter_Part_description = Измеряет радиацию окружающей среды. // "Measure environment radiation."
		#kerbalism-geigercounter_Part_manufacturer = Muller and Sons // "Muller and Sons"
		#kerbalism-geigercounter_Part_title = Счётчик Гейгера // "Geiger Counter"

		// ********** Деталь: kerbalism-gravityring
		#kerbalism-gravityring_Part_description = Искусственная гравитация может отсрочить неизбежные последствия невесомости для организма. Если вы не против силы Кориолиса. // "Artificial gravity can delay the inevitable consequences of zero-g on the body. If you don't mind the Coriolis."
		#kerbalism-gravityring_Part_manufacturer = Mehka Awesome Productions // "Mehka Awesome Productions"
		#kerbalism-gravityring_Part_title = Гравитационное кольцо // "Gravity Ring"

		// ********** Деталь: kerbalism-greenhouse
		#kerbalism-greenhouse_Part_description = Выращивайте урожай в глубинах космоса или на поверхности какой-нибудь безжизненной скалы. // "Grow crops in the deeps of space or on the surface of some desolate rock."
		#kerbalism-greenhouse_Part_manufacturer = TripleZeta Workshops // "TripleZeta Workshops"
		#kerbalism-greenhouse_Part_title = Оранжерея // "Greenhouse"

		// ********** Деталь: kerbalism-lifesupportmodule
		#kerbalism-lifesupportmodule_Part_description = Видя отсутствие резервирования СЖО, центр управления срочно приказал нам переоборудовать этот химический завод во внешний модуль СЖО. Гарантированно взрывается только на 147.28% чаще, чем оригинал. // "Seeing the lack of ECLSS redundancy, mission control urgently ordered us to convert this chemical plant to an external ECLSS module. Guaranteed to explode only 147.28% as often as the original."
		#kerbalism-lifesupportmodule_Part_manufacturer = Lambda Aerospace // "Lambda Aerospace"
		#kerbalism-lifesupportmodule_Part_title = Внешний модуль СЖО // "External ECLSS Module"

		// ********** Деталь: kerbalism-radialpump
		#kerbalism-radialpump_Part_title = Насос-O-Matic' Океанический добытчик ресурсов // "Pump-O-Matic' Oceanic Resource Extractor"
		#kerbalism-radialpump_Part_description = Разработан для добычи ценных ресурсов из океанов планет. Насос-O-Matic использует центробежный насос, соперничающий с пожарными службами, для перекачки жидких ресурсов в накопительные баки для последующей переработки. // "Designed to help extract valuable resources from the oceans of planets, the Pump-O-Matic uses a centrifugal pump rivaled by fire rescue services to pump liquid resources into holding tanks for later processing."

		// ********** Деталь: kerbalism-minipump
		#kerbalism_minipump_Part_title = Насос-O-Matic Junior' Океанический добытчик ресурсов // "Pump-O-Matic Junior' Oceanic Resource Extractor"
		#kerbalism_minipump_Part_description = Меньшая версия популярного Насоса-O-Matic, этот насос предназначен для добычи ценных ресурсов из океанов планет. // "A smaller version of the popular Pump-O-Matic, this pump is designed to help extract valuable resources from the oceans of planets."

		// ********** Деталь: kerbalism-container-hex-large
		#kerbalism_container_hex_large_Part_title = Контейнер для жизнеобеспечения HexCan, 3 м // "Life Support HexCan, 3m"
		#kerbalism_container_hex_large_Part_manufacturer = PanSpace Manufacturing Inc. Ltd. LLC. Co. в сотрудничестве с Thunder Aerospace Corporation // "PanSpace Manufacturing Inc. Ltd. LLC. Co. in cooperation with Thunder Aerospace Corporation"
		#kerbalism_container_hex_large_Part_description = 3-метровый контейнер для различных припасов. // "A 3m long resource canister for various supplies."

		// ********** Деталь: kerbalism-container-hex-normal
		#kerbalism_container_hex_normal_Part_title = Контейнер для жизнеобеспечения HexCan, 1.5 м // "Life Support HexCan, 1.5m"
		#kerbalism_container_hex_normal_Part_manufacturer = PanSpace Manufacturing Inc. Ltd. LLC. Co. в сотрудничестве с Thunder Aerospace Corporation // "PanSpace Manufacturing Inc. Ltd. LLC. Co. in cooperation with Thunder Aerospace Corporation"
		#kerbalism_container_hex_normal_Part_description = 1.5-метровый контейнер для различных припасов. // "A 1.5m long resource canister for various supplies."

		// ********** Деталь: kerbalism-container-hex-small
		#kerbalism_container_hex_small_Part_title = Контейнер для жизнеобеспечения HexCan, 0.75 м // "Life Support HexCan, 0.75m"
		#kerbalism_container_hex_small_Part_manufacturer = PanSpace Manufacturing Inc. Ltd. LLC. Co. в сотрудничестве с Thunder Aerospace Corporation // "PanSpace Manufacturing Inc. Ltd. LLC. Co. in cooperation with Thunder Aerospace Corporation"
		#kerbalism_container_hex_small_Part_description = 0.75-метровый контейнер для различных припасов. // "A 0.75m long resource canister for various supplies."

		//Профиль // "Profile"
		#KERBALISM_low_battery = Батареи $VESSEL почти разряжены@<i>Мы выжимаем последние капли энергии</i>|Батареи $VESSEL почти разряжены@<i>Отключение неосновных систем</i> // "$VESSEL batteries are almost empty@<i>We are squeezing the last bit of juice</i>|$VESSEL batteries are almost empty@<i>Shutting down non-essential systems</i>"
		#KERBALISM_empty_battery = На $VESSEL больше нет электрического заряда@<i>Системы жизнеобеспечения отключены</i>|На $VESSEL больше нет электрического заряда@<i>Мы потеряли управление</i> // "There is no more ElectricCharge on $VESSEL@<i>Life support systems are off</i>|There is no more ElectricCharge on $VESSEL@<i>We lost control</i>"
		#KERBALISM_refill_battery = Батареи $VESSEL перезаряжены@<i>Экипажу снова разрешена музыка</i>|Батареи $VESSEL перезаряжены@<i>Системы снова в сети</i> // "$VESSEL batteries recharged@<i>The crew is allowed music again</i>|$VESSEL batteries recharged@<i>Systems are back online</i>"

		#KERBALISM_oxygen_warning = $ON_VESSEL$KERBAL не может дышать // "$ON_VESSEL$KERBAL can't breathe"
