		#KERBALISM_water_warning = $ON_VESSEL$KERBAL хочет пить // "$ON_VESSEL$KERBAL is thirsty"
		#KERBALISM_water_danger = $ON_VESSEL$KERBAL обезвожен // "$ON_VESSEL$KERBAL is dehydrated"
		#KERBALISM_water_fatal = $ON_VESSEL$KERBAL умер от обезвоживания // "$ON_VESSEL$KERBAL died from dehydration"
