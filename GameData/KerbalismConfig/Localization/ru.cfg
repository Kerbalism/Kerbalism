		// Пользовательские эксперименты Kerbalism // "Kerbalism custom experiments"
		#KERBALISM_EXPERIMENT_SALT_title = Анализ солёности // "Salinity Analysis"
		#KERBALISM_EXPERIMENT_SALT_desc = Тест на подлинность солёности методом облизывания: учёные-кербалы уверяют нас, что этот тест очень научный. // "Saline Authenticity Licking Test: Kerbal Scientists assure us this test is very much scientific."
		#KERBALISM_EXPERIMENT_H2O_title = Анализ образца воды // "Water Sample Analysis"
		#KERBALISM_EXPERIMENT_H2O_desc = Наблюдение гидро-ди-оксила: этот образец был сокращён до H2O. // "Hydro-di-Oxyl Observation: This sample has been shortened to H2O."
		#KERBALISM_EXPERIMENT_CHILLED_title = Изучение криогенной среды // "Cryogenic Environment Study"
		#KERBALISM_EXPERIMENT_CHILLED_desc = Хлорофилловое садоводство в живых лабораторных экспериментальных определениях: учёные будут наблюдать за ростом травы ради науки. // "Chlorophyl Horticulture In Lived Laboratory Experimental Determinations: Scientists will spend time watching grass grow for science."
		#KERBALISM_EXPERIMENT_RELAX_title = Изучение отдыха экипажа // "Crew Relaxation Study"
		#KERBALISM_EXPERIMENT_RELAX_desc = Объяснение реголитового экспериментального лабораторного анализа: учёные будут развивать осмысленные отношения с местным реголитом. // "Regolith Experiential Laboratory Analysis eXplanation: Scientists will spend time developing a meaningful relationship with the local regolith."
		#KERBALISM_EXPERIMENT_JAMMED_title = Исследование помех сигнала // "Signal Interference Survey"
		#KERBALISM_EXPERIMENT_JAMMED_desc = Обоснованный анализ тщательной осознанности при выдавливании данных // "Justified Analysis of Meticulous Mindfulness while Extruding Data"
		#KERBALISM_EXPERIMENT_TRAPPED_title = Изучение длительного заключения // "Long-Term Confinement Study"
		#KERBALISM_EXPERIMENT_TRAPPED_desc = Технический ретро-анализ размещения точек в жилой среде // "Technical Retro-Analysis of Point Placement in Environmental Dwelling"
		#KERBALISM_EXPERIMENT_SALINE_title = Анализ состава солёной воды // "Saline Composition Analysis"
		#KERBALISM_EXPERIMENT_SALINE_desc = Долгосрочное исследование щёлочности морской воды для нейтрализации среды: пересоленные учёные-кербалы ищут способы нейтрализовать воду. // "Sea Alkalinity Longterm Investigation to Neutralise Environment: Overly salted Kerbal Scientists investigate ways to neutralise the water."
		#KERBALISM_EXPERIMENT_BIRDIE_title = Наблюдение полёта на малой высоте // "Low-Altitude Flight Observation"
		#KERBALISM_EXPERIMENT_BIRDIE_desc = Ретконное исследование биомов на возвышенности // "Biome Investigation Retconning Deep Investigations at Elevation"
		#KERBALISM_EXPERIMENT_FLIGHT_title = Запись орбитального полёта // "Orbital Flight Record"
		#KERBALISM_EXPERIMENT_FLIGHT_desc = Парящий лёгкий в гравитации, держась крепко // "Floating Lightly In Gravity while Holding Tightly"
		#KERBALISM_EXPERIMENT_HERRING_title = Исследование солнечной среды // "Solar Environment Survey"
		#KERBALISM_EXPERIMENT_HERRING_desc = Исследование устойчивости гелиосферы и намеренное естественное восстановление: изучение физиологических изменений кербалов в межпланетном пространстве. // "Heliosphere Environment Resilience and Recuperation Intentional Naturalising Growth: Study on Kerbal physiological changes whilst in inter-planetary space."
		#KERBALISM_EXPERIMENT_FLOAT_title = Эксперимент по дрейфу в околоземной орбите // "Near-Orbit Drift Experiment"
		#KERBALISM_EXPERIMENT_FLOAT_desc = Целенаправленное ленивое орбитальное аналитическое тестирование: длительные исследования сна, еды и наблюдения за рассветами в микрогравитации. // "Focused Lazing on Orbital Analytic Testing: Long duration studies of sleeping, eating and watching the sunrises in microgravity."
		#KERBALISM_EXPERIMENT_LEAVE_title = Исследование ухода в дальний космос // "Deep Space Departure Survey"
		#KERBALISM_EXPERIMENT_LEAVE_desc = Длительный эксперимент по воздействию на объём: сверхдлительное исследование влияния на кербалов, запертых в консервной среде. // "Long Experiment Affecting Volume Exposure: Ultra-long duration study on the effects of trapping Kerbals in a canned environment."
		#KERBALISM_EXPERIMENT_CLAM_title = Изучение подводной среды обитания // "Underwater Habitat Study"
		#KERBALISM_EXPERIMENT_CLAM_desc = Измерение закрытой системы жизнеобеспечения: по-видимому, некоторые кербалы предпочитают физическое давление психологическому. // "Closed Lifesupport Assessed Measurements: Apparently some Kerbals would prefer physical pressure to the psychological one."
		#KERBALISM_EXPERIMENT_WRECK_title = Обследование подводных обломков // "Underwater Wreck Survey"
		#KERBALISM_EXPERIMENT_WRECK_desc = Водная разведка в сравнении с Кербином // "Water Reconnaissance Experiment Comparing to Kerbin"
		#KERBALISM_EXPERIMENT_STAKE_title = Наблюдение за наземным якорем // "Ground Anchor Observation"
		#KERBALISM_EXPERIMENT_STAKE_desc = Ситуационное тестирование для продвижения равенства на Кербине // "Situational Testing Advancing Kerbin Equality"
		#KERBALISM_EXPERIMENT_SHAKE_title = Мониторинг поверхностных вибраций // "Surface Vibration Monitoring"
		#KERBALISM_EXPERIMENT_SHAKE_desc = Поверхностный гидратированный анализ кинетической экспозиции: кербалы-инженеры проверяют, можно ли использовать сейсмическую активность для встряхивания напитков. // "Surface Hydrated Analysis of Kinetic Exposition: Kerbal Engineers testing if seismic activity could be used for shaking drinks."
		#KERBALISM_EXPERIMENT_CURVE_title = Профиль верхней атмосферы // "Upper Atmosphere Profile"
		#KERBALISM_EXPERIMENT_CURVE_desc = Проверка колеблющихся радиальных векторов среды: убедиться, что планета всё ещё круглая из верхних слоёв атмосферы. // "Checking Undulating Radial Vectors of Environment: Ensuring the planet is still round from the upper atmosphere."
		#KERBALISM_EXPERIMENT_WING_title = Аэродинамика на малой высоте // "Low-Altitude Aerodynamics"
		#KERBALISM_EXPERIMENT_WING_desc = Блуждающее исследование не на земле: не так много желающих наблюдать, как земля проносится так быстро! // "Wandering Investigation Not on the Ground: Not many takers to watch the ground zipping past so quickly!"
		#KERBALISM_EXPERIMENT_CLOUD_title = Наблюдение структуры облаков // "Cloud Structure Observation"
		#KERBALISM_EXPERIMENT_CLOUD_desc = Кумулятивное продольное понимание динамики: "Динамики чего?", — спрашивают многие кербалы. // "Cumulative Longitudinal Overland Understanding of Dynamic: "Dynamic what?", many Kerbals ask."
		#KERBALISM_EXPERIMENT_TELEMETRY_title = Отчёт телеметрии // "Telemetry Report"
		#KERBALISM_EXPERIMENT_LITE_title = Лёгкое орбитальное исследование // "Lightweight Orbital Survey"
		#KERBALISM_EXPERIMENT_LITE_desc = Информационный световой технический эксперимент. Буквально просто находится ли он на солнце или нет. // "Luminosity Information Technical Experiment. Literally is just is it in the sun or not."
		#KERBALISM_EXPERIMENT_MITE_title = Атмосферное орбитальное микро-исследование // "Atmospheric Orbital Micro-Survey"
		#KERBALISM_EXPERIMENT_MITE_desc = Магнитно-ионосферная трансмиссивная оценка. Измеряет напряжённость магнитных полей в ионосфере. // "Magnosity Ionospheric Transmissive Evaluation. Measures strength of magnetic fields in ionosphere."
		#KERBALISM_EXPERIMENT_SITE_title = Орбитальное обследование местности // "Orbital Site Survey"
		#KERBALISM_EXPERIMENT_SITE_desc = Исследование межпланетного мусора. Измеряет пыль в вакууме. // "Survey Interplanetary Trash Experiment. Measures dust through the vacuum."
		#KERBALISM_EXPERIMENT_ResourceSurvey_title = Исследование ресурсов // "Resource Survey"
		#KERBALISM_EXPERIMENT_ResourceSurvey_desc = Выполняет спектрометрический анализ верхнего слоя почвы для открытия карты ресурсов тела // "Perform a spectrometry analysis of the top soil layer to unlock the resource map of the body"
		#KERBALISM_EXPERIMENT_BEEP_title = Сканирование биомов на низкой орбите // "Low Orbit Biome Scan"
		#KERBALISM_EXPERIMENT_BEEP_desc = Пакет эксклюзивных биомных экспериментов // "Biome Exclusive Experiment Package"
		#KERBALISM_EXPERIMENT_DING_title = Сканирование с высокой орбиты // "High Orbit Scan"
		#KERBALISM_EXPERIMENT_DING_desc = Динамическое исследование в нулевой гравитации // "Dynamic Investigation in Null Gravity"
		#KERBALISM_EXPERIMENT_TICK_title = Сканирование вблизи Солнца // "Solar Proximity Scan"
		#KERBALISM_EXPERIMENT_TICK_desc = Передаваемое исследование космических знаний // "Transmissble Investigation of Cosmic Knowledge"

		//Сканирование радиации // "Radiation Scan"
		#KERBALISM_EXPERIMENT_Radiation_title = Сканирование радиации // "Radiation Scan"
		//Результаты экспериментов // "Experiment results"
		#KERBALISM_EXPERIMENT_Radiation_default = Святые коровы, эти результаты потрясающие! // "Holy cow these results are amazing!."
		#KERBALISM_EXPERIMENT_Radiation_MohoSrfLanded = Счётчик Гейгера согласен, что Мохо было бы круче с лавой. КЦП сообщил, что разговаривать со счётчиком Гейгера строго запрещено. // "The Geiger counter agrees that Moho would be cooler with lava. The KSC has informed you that talking to the Geiger counter is strictly forbidden."
		#KERBALISM_EXPERIMENT_Radiation_EveSrfLanded = Похоже, что высокий уровень радиации — это единственное, о чём не стоит беспокоиться на поверхности Эве. // "It seems that high radiation levels are the one thing you don't have to worry about on the surface of Eve."
		#KERBALISM_EXPERIMENT_Radiation_GillySrfLanded = Вы слишком весело прыгаете вокруг, чтобы проверять уровень радиации. // "You are having too much fun bouncing around to check the radiation levels."
		#KERBALISM_EXPERIMENT_Radiation_KerbinSrfLanded = Уровень радиации на Кербине буквально нормальный. Что-то должно блокировать радиацию. // "Radiation levels are quite literally nominal here on Kerbin. Something must be blocking the radiation."
		#KERBALISM_EXPERIMENT_Radiation_MunSrfLanded = Радиация на поверхности Муны довольно высока, для любого будущего проживания потребуется больше защиты. // "Radiation on the surface of the Mun is fairly high, any future habitation would require more shielding."
		#KERBALISM_EXPERIMENT_Radiation_MinmusSrfLanded = Глядя на уровень радиации, вы жалеете, что попробовали поверхность Минмуса на вкус. // "Looking at the radiation levels, you regret tasting the surface of Minmus."
		#KERBALISM_EXPERIMENT_Radiation_DunaSrfLanded = Эти результаты критичны для развития колонии на Дуне. Жалко, если с ними что-то случится... // "These results are critical for the development of a Duna colony. Shame if something were to happen to them..."
		#KERBALISM_EXPERIMENT_Radiation_IkeSrfLanded = Поверхность содержит следы радиоактивных соединений, НИОКР считает, что это элементы, созданные взаимодействием солнечного ветра с атмосферой Дуны. // "The surface contains a trace amount of radioactive compounds, R&D believed these are elements created by interactions between solar wind and Duna's atmosphere."
		#KERBALISM_EXPERIMENT_Radiation_DresSrfLanded = Сравнивая эти результаты с образцами поверхности, Дрес, по-видимому, состоит из большого количества тяжёлых радиоактивных металлов // "Cross referencing these results with surface samples, Dres seems to consist of a large amount of heavy, radioactive metals"
		#KERBALISM_EXPERIMENT_Radiation_LaytheSrfLanded = Атмосфера и активное ядро Лейте защищают её поверхность от интенсивного радиационного пояса Джула, но фоновое излучение значительно выше, чем на Кербине // "Laythe's atmosphere and active core protect its surface from Jool's intense radiation belt, but the background radiation is significantly higher than Kerbin's"
		#KERBALISM_EXPERIMENT_Radiation_VallSrfLanded = Валлу повезло, что она не находится в радиационном поясе Джула, но радиация на поверхности всё ещё значительна. // "Vall is fortunate enough to not be located in Jool's radiation belt, but the radiation on the surface is still significant."
		#KERBALISM_EXPERIMENT_Radiation_TyloSrfLanded = Функционирующей магнитосферы Тило достаточно, чтобы защитить планету от большей части радиации Джула, но отсутствие атмосферы означает, что значительное количество радиации всё ещё достигает поверхности // "The functioning magnetosphere Tylo possesses is enough to shield the planet from most of Jool's radiation, but its lack of atmosphere means a significant amount of radiation still reaches the surface"
		#KERBALISM_EXPERIMENT_Radiation_BopSrfLanded = КЦП предупреждает не пытаться найти интенсивный источник радиации, который они заметили с орбиты. // "KSC warns against trying to locate the intense source of radiation they spotted from orbit."
		#KERBALISM_EXPERIMENT_Radiation_PolSrfLanded = Похоже, что Пол содержит большое количество радиоактивных изотопов водорода и гелия, отложенных Джулом за тысячи лет. // "It seems that Pol contains a large amount of radioactive Hydrogen and Helium isotopes, deposited by Jool over thousands of years."
		#KERBALISM_EXPERIMENT_Radiation_EelooSrfLanded = Так далеко от Кербола, гораздо больше межзвёздного излучения достигает поверхности. Это было бы отличным местом для будущих исследований // "This far from Kerbol, much more interstellar radiation reaches the surface. This would be a great place for future study"

		#KERBALISM_EXPERIMENT_Radiation_EveFlyingLow = Плотная атмосфера и большая магнитосфера Эве предотвращают попадание радиации на эту высоту. // "Eve's thick atmosphere and large magnetosphere prevents any radiation from reaching this altitude."
		#KERBALISM_EXPERIMENT_Radiation_KerbinFlyingLow = Вибрации от вашей ракеты делают циферблаты нечитаемыми, поэтому вы решаете придумать результаты. // "The vibrations from your rocket make the dials unreadable, so you decide to make up the results."
		#KERBALISM_EXPERIMENT_Radiation_DunaFlyingLow = Атмосфера, по-видимому, блокирует больше радиации, чем предполагалось изначально. Это хороший знак для будущих миссий на Дуну. // "The atmosphere seems to block more radiation then originally predicted. This bodes well for future Duna missions."
		#KERBALISM_EXPERIMENT_Radiation_JoolFlyingLow = Вы собираетесь проверить счётчик Гейгера, но он отказывается показывать показания, пока вы не выйдете из атмосферы. // "You go to check the Geiger counter, but it refuses to display a reading until you take it out of the atmosphere."
		#KERBALISM_EXPERIMENT_Radiation_LaytheFlyingLow = Океаны внизу излучают неожиданное количество радиации. // "The oceans below emit an unexpected amount of radiation."
		#KERBALISM_EXPERIMENT_Radiation_EveFlyingHigh = Вы слишком заняты попытками не сгореть в атмосфере, чтобы смотреть на счётчик Гейгера. // "You are too busy trying not to burn up in the atmosphere to look at the Geiger counter."
		#KERBALISM_EXPERIMENT_Radiation_KerbinFlyingHigh = Атмосфера поглощает большую часть радиации, даже там, наверху. // "The atmosphere is absorbing most of the radiation, even up there."
		#KERBALISM_EXPERIMENT_Radiation_DunaFlyingHigh = Атмосфера здесь излучает большое количество ионизированных частиц. // "The atmosphere here is emitting large amounts of ionized particles."
		#KERBALISM_EXPERIMENT_Radiation_JoolFlyingHigh = КЦП заверил вас, что ваш третий глаз — это совершенно нормально. // "The KSC has insured that your third eye is completely normal."
		#KERBALISM_EXPERIMENT_Radiation_LaytheFlyingHigh = Радиация от Джула производит интересные побочные продукты при бомбардировке атмосферы Лейте // "The radiation from Jool produces interesting by-products when it bombards Laythe's atmosphere"
		#KERBALISM_EXPERIMENT_Radiation_SunInSpaceLow = Более 9000!! // "It's over 9000!!"
		#KERBALISM_EXPERIMENT_Radiation_MohoInSpaceLow = НИОКР сообщает, что эти результаты внесли вклад в научный прорыв. Вы слишком заняты обниманием кондиционера, чтобы волноваться. // "R&D informs you that these results have contributed to a scientific breakthrough. You are too busy hugging the air conditioner to care."
		#KERBALISM_EXPERIMENT_Radiation_EveInSpaceLow = Атмосфера Эве излучает странные ионы, которые сбивают ваши показания. // "Eve's atmosphere emits strange ions that throw off your readings."
		#KERBALISM_EXPERIMENT_Radiation_GillyInSpaceLow = Уровень радиации здесь колеблется из-за эксцентричной орбиты Гилли и магнитосферы Эве. // "The radiation levels here flux because of Gilly's eccentric orbit and Eve's magnetosphere."
		#KERBALISM_EXPERIMENT_Radiation_KerbinInSpaceLow = Радиационная среда там сложнее, чем мы думали. Это даст НИОКР что-то новое для изучения. // "The radiation environment up there is more complex than we throught. This should give R&D something new to study."
		#KERBALISM_EXPERIMENT_Radiation_MunInSpaceLow = Вы замечаете устойчивый пульс радиации, когда пролетаете над тёмной стороной Муны. Вероятно, это ничего. // "You notice a steady pulse of radiation as you pass over the dark side of the Mun. It's probably nothing."
		#KERBALISM_EXPERIMENT_Radiation_MinmusInSpaceLow = Результаты показывают, что Минмус содержит большое количество радиоактивных соединений, смешанных с ледяной корой. // "The results indicate that Minmus has large amounts of radioactive compounds mixed within the icy crust."
		#KERBALISM_EXPERIMENT_Radiation_DunaInSpaceLow = Солнце сдувает хрупкую атмосферу Дуны, так как Дуна излучает поток ионизированных частиц. // "The sun is stripping away Duna's fragile atmosphere, as Duna is emitting a stream of ionized particles."
		#KERBALISM_EXPERIMENT_Radiation_IkeInSpaceLow = Близкая орбита и приливный захват Айка означают, что когда вы находитесь над стороной Айка, обращённой к Дуне, уровень радиации резко падает. // "Ike's close orbit and tidally locked state means that when you are over the side of Ike facing Duna the radiation levels drop immensely."
		#KERBALISM_EXPERIMENT_Radiation_DresInSpaceLow = Счётчик Гейгера обнаружил большое количество радиации, исходящей от Дреса. // "The Geiger counter has detected large amounts of radiation originating from Dres."
		#KERBALISM_EXPERIMENT_Radiation_JoolInSpaceLow = КЦП посоветовал, что вам не разрешат вернуться из-за опасений, что вы заразите остальное кербальское население // "KSC has advised that you will not be allowed to return for fear that you will contaminate the rest of Kerbalkind"
		#KERBALISM_EXPERIMENT_Radiation_LaytheInSpaceLow = Глядя вниз на прекрасный океан внизу, вы забываете, что медленно умираете от лучевой болезни. // "As you look down at the beautiful ocean below, you forget that you are slowly dying of radiation poisoning."
		#KERBALISM_EXPERIMENT_Radiation_VallInSpaceLow = Удивительно, но уровень радиации находится на приемлемом уровне. // "Amazingly, the radiation levels are at a reasonable level."
		#KERBALISM_EXPERIMENT_Radiation_TyloInSpaceLow = Тонкая магнитосфера Тило действует как генератор, усиливая уже интенсивное радиационное поле Джула. // "The subtle magnetosphere of Tylo acts as a generator, magnifying Jool's already intense radiation field."
		#KERBALISM_EXPERIMENT_Radiation_BopInSpaceLow = Боп имеет аномально высокое количество радиации, которое, по-видимому, сконцентрировано в точке 68° северной широты, 114° восточной долготы. Странно // "Bop has an abnormally high amount of radiation that seems to be pin-pointed at 68 degrees north, 114 degrees east. Strange"
		#KERBALISM_EXPERIMENT_Radiation_PolInSpaceLow = Пространство вокруг Пола заполнено радиоактивными ионами, которые были захвачены магнитосферой Джула. // "The space around Pol is filled with radioactive ions that have been unfortunate enough to be caught by Jool's magnetosphere."
		#KERBALISM_EXPERIMENT_Radiation_EelooInSpaceLow = НИОКР стремится изучить, какое влияние большое количество межзвёздной радиации оказало на поверхность Илу. // "R&D is keen to study what effects the large amount of interstellar radiation has done to the surface of Eeloo."
		#KERBALISM_EXPERIMENT_Radiation_SunInSpaceHigh = КЦП сообщает, что они, *возможно*, забыли добавить защиту. // "The KSC informs you that they *may* have forgotten to add the shielding."
		#KERBALISM_EXPERIMENT_Radiation_MohoInSpaceHigh = Радиация от солнца резко возросла за время вашего путешествия. // "The radiation from the sun has picked up dramatically over the course of your journey."
		#KERBALISM_EXPERIMENT_Radiation_EveInSpaceHigh = Вы не ждёте с нетерпением путешествия через радиационный пояс Эве. // "You are not looking forward to traveling through Eve's radiation belt."
		#KERBALISM_EXPERIMENT_Radiation_GillyInSpaceHigh = Вы отказываетесь проверять уровень радиации, пока КЦП не перестанет шутить про картошку. // "You refuse to check the radiation levels unless the KSC stops making Potato puns."
		#KERBALISM_EXPERIMENT_Radiation_KerbinInSpaceHigh = Это место опасно. // "This place is dangerous."
		#KERBALISM_EXPERIMENT_Radiation_MunInSpaceHigh = Вы пересекли радиационный пояс Кербина и не умерли. Вы беспокоитесь, что это породит кучу сумасшедших теорий заговора. // "You crossed Kerbin's radiation belt, and did not die. You worry that this will spawn a bunch of crazy conspiracy theories."
		#KERBALISM_EXPERIMENT_Radiation_MinmusInSpaceHigh = Вы улавливаете аномальное количество радиации, но не можете определить источник. // "You pick up an abnormal amount of radiation, but can't figure out the origin."
		#KERBALISM_EXPERIMENT_Radiation_DunaInSpaceHigh = У Дуны, по-видимому, нет магнитосферы, поэтому космическая радиация будет проблемой для будущих миссий на Дуну. // "Duna doesn't seem to have a magnetosphere, so cosmic radiation will be a problem for future Duna missions."
		#KERBALISM_EXPERIMENT_Radiation_IkeInSpaceHigh = Неожиданно, Айк оказывается достаточно магнитным, чтобы нарушать ионы, срываемые с атмосферы Дуны. // "Unexpectedly, Ike appears to be magnetic enough to mess with the ion's striped from Duna's atmosphere."
		#KERBALISM_EXPERIMENT_Radiation_DresInSpaceHigh = В астероиде никто не услышит, как вы бьёте себя по лбу, когда понимаете, что забыли счётчик Гейгера. // "In the asteroid, nobody can hear you face palm when you realise that you forgot the Geiger counter."
		#KERBALISM_EXPERIMENT_Radiation_JoolInSpaceHigh = Радиация, испускаемая Джулом, достигает ошеломляющего уровня, и вы начинаете желать, чтобы были на миссии по исследованию Дуны. // "The radiation being emitted from Jool is a staggering amount, and you start to wish you were on the Duna exploration mission."
		#KERBALISM_EXPERIMENT_Radiation_LaytheInSpaceHigh = Лейте, невероятно, оказывает большое сопротивление атаке радиационного пояса Джула. Удачи тебе, Лейте. Удачи. // "Laythe is, incredibly, putting up a large resistance to the onslaught of Jool's radiation belt. God speed Laythe. God speed."
		#KERBALISM_EXPERIMENT_Radiation_VallInSpaceHigh = Хотя Валл и не находится в главном радиационном поясе, он всё равно жестоко страдает от радиации Джула. // "Even though Vall isn't located in the main radiation belt, it is still viciously punished by Jool's radiation."
		#KERBALISM_EXPERIMENT_Radiation_TyloInSpaceHigh = Радиация от Джула образует интенсивный пояс вокруг Тило, но, к счастью, похоже, что до поверхности доходит не так много. Но "много" — это относительный термин. // "The radiation from Jool forms an intense belt around Tylo, but luckily it doesn't look like much reaches the surface. But much is a relative term."
		#KERBALISM_EXPERIMENT_Radiation_BopInSpaceHigh = Боп, по-видимому, является источником интенсивного излучения, но среди радиационного поля Джула это не кажется значительным. // "Bop actually seems to be a source of intense radiation, but amongst Jool's radiation field, it doesn't appear significant."
		#KERBALISM_EXPERIMENT_Radiation_PolInSpaceHigh = Пол находится достаточно далеко от Джула, чтобы получать ионизированные изотопы из магнитосферы Джула и межпланетного газа. // "Pol is far enough away from Jool that it receives ionized isotopes sourced from Jool's magnetosphere and interplanetary gas."
		#KERBALISM_EXPERIMENT_Radiation_EelooInSpaceHigh = По мере ослабления влияния Кербола межзвёздное излучение становится гораздо более выраженным. Тайны галактики открыты перед вами. // "As Kerbol's influence weakens, interstellar radiation becomes much more pronounced. The secrets of the galaxy lay open to you."
