		#KERBALISM_NFE_NuclearProcessor_title = Ядерный переработчик // "Nuclear Processor"
		#KERBALISM_NFE_UraniumReprocessor_title = Переработчик урана // "Uranium Reprocessor"
		#KERBALISM_NFE_UraniumReprocessor_desc = Перерабатывает <b>Отработанное топливо</b> в <b>Обогащённый уран</b>. // "Reprocess <b>DepletedFuel</b> into <b>EnrichedUranium</b>."
