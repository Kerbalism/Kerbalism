		// Описания деталей DMagic Orbital Science (переопределены патчами поддержки Kerbalism) // "DMagic Orbital Science part descriptions (overridden by Kerbalism support patches)"
		#KERBALISM_DMOS_magnetometer_desc = Магнитометры используются для определения величины и направления планетарных магнитных полей. Длинная штанга отделяет эти приборы от любых помех, вызванных магнитными элементами в зонде. // "The magnetometer instruments are used to determine the magnitude and direction of planetary magnetic fields. The long boom separates these instruments from any interference caused by magnetic elements in the probe."
		#KERBALISM_DMOS_bathymetry_desc = Используйте этот подводный научный комплект для исследования неизведанных глубин океанов. // "Use this submersible science package to explore the uncharted depths of the oceans."
		#KERBALISM_DMOS_recon_desc = Этот камерный обзорный телескоп имеет непрерывно панорамирующую апертуру, охватывающую большие участки поверхности. // "This camera surveillance telescope features a continuously panning aperture that covers large bands of the surface."
