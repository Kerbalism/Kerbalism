		#KERBALISM_BranchLoc_Thaw_LqdCO2_into_CarbonDioxide = Размораживает <b>Жидкий CO2</b> в <b>Углекислый газ</b>. // "Thaw <b>LqdCO2</b> into <b>CarbonDioxide</b>."
		#KERBALISM_BranchLoc_Carbon_Monoxide_Heater = Нагреватель угарного газа // "Carbon Monoxide Heater"
		#KERBALISM_BranchLoc_Thaw_LqdCO_into_CarbonMonoxide = Размораживает <b>Жидкий CO</b> в <b>Угарный газ</b>. // "Thaw <b>LqdCO</b> into <b>CarbonMonoxide</b>."
		#KERBALISM_BranchLoc_Thaw_LqdHydrogen_into_Hydrogen = Размораживает <b>Жидкий водород</b> в <b>Водород</b>. // "Thaw <b>LqdHydrogen</b> into <b>Hydrogen</b>."
		#KERBALISM_BranchLoc_Thaw_LqdMethane_into_Methane = Размораживает <b>Жидкий метан</b> в <b>Метан</b>. // "Thaw <b>LqdMethane</b> into <b>Methane</b>."
		#KERBALISM_BranchLoc_Thaw_LqdNitrogen_into_Nitrogen = Размораживает <b>Жидкий азот</b> в <b>Азот</b>. // "Thaw <b>LqdNitrogen</b> into <b>Nitrogen</b>."
		#KERBALISM_BranchLoc_Thaw_LqdOxygen_into_Oxygen = Размораживает <b>Жидкий кислород</b> в <b>Кислород</b>. // "Thaw <b>LqdOxygen</b> into <b>Oxygen</b>."
		#KERBALISM_BranchLoc_Fusion_Pellet_Foundry = Литейный завод термоядерных гранул // "Fusion Pellet Foundry"
