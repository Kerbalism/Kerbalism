		#KERBALISM_BranchLoc_Silicates_Splitter = Расщепитель силикатов // "Silicates Splitter"
		#KERBALISM_BranchLoc_Spodumene_Splitter = Расщепитель сподумена // "Spodumene Splitter"
		#KERBALISM_BranchLoc_Minerals_Splitter = Расщепитель минералов // "Minerals Splitter"
		#KERBALISM_BranchLoc_ExoticMinerals_Splitter = Расщепитель экзотических минералов // "Exotic Minerals Splitter"
		#KERBALISM_BranchLoc_Sterling_Molten_Metal_Foundry = Литейный завод расплавленных металлов Sterling // "Sterling Molten Metal Foundry"
		#KERBALISM_BranchLoc_Split_Alumina_for_Metals_and_Oxygen_gas_An_actua = Расщепляет <b>Глинозём</b> на <b>Металлы</b> и газообразный <b>Кислород</b>. Ресурс "Алюминий" существует, но в настоящее время не используется. Кислород полезен для дыхания и топлива, а Металлы можно превращать в ракетные детали или использовать для печати и заправки гибридных твердотопливных ускорителей. // "Split <b>Alumina</b> for <b>Metals</b> and <b>Oxygen</b> gas. An Aluminium resource exists, but is not currently used. The oxygen is useful for breathing and propellant, while the Metals can be turned into Rocket Parts or used to print and refill hybrid Solid Rocket Boosters."
		#KERBALISM_BranchLoc_Suprisingly_Monazite_is_fairly_common_and_is_ful = На удивление, <b>Монацит</b> довольно распространён и полон <b>Редких металлов</b> и <b>Кислорода</b>. Для полезных материалов всегда найдётся место. // "Surprisingly, <b>Monazite</b> is fairly common and full of <b>RareMetals</b> and <b>Oxygen</b>. There is always room for useful materials."
		#KERBALISM_BranchLoc_Silicates_are_good_for_two_things_Silicon_for_co = <b>Силикаты</b> полезны для двух вещей: <b>Кремний</b> для компьютерных деталей и <b>Кислород</b> почти для всего остального. Сейчас нас больше всего интересует кислород. // "<b>Silicates</b> are useful for two things: <b>Silicon</b> for computer parts, and <b>Oxygen</b> for almost everything else. Right now, we mostly care about the oxygen."
		#KERBALISM_BranchLoc_Split_Spodumene_extended_desc = Расщепляет <b>Сподумен</b> на <b>Литий</b>, <b>Алюминий</b> и <b>Силикаты</b>. Алюминий полезен для печати и заправки гибридных твердотопливных ускорителей. // "Split <b>Spodumene</b> for <b>Lithium</b>, <b>Aluminium</b>, and <b>Silicates</b>. The Aluminium is useful for printing and refilling hybrid Solid Rocket Boosters."
		#KERBALISM_BranchLoc_Extract_Oxygen_from_Ore_MRE_desc = Извлекает <b>Кислород</b>, <b>Углекислый газ</b> и <b>Защиту</b> из <b>Руды</b>. При необходимости <b>Углекислый газ</b> и/или <b>Защита</b> будут стравиваться для продолжения добычи <b>Кислорода</b>. // "Extract <b>Oxygen</b>, <b>CarbonDioxide</b>, and <b>Shielding</b> from <b>Ore</b>. If needed, <b>CarbonDioxide</b> and/or <b>Shielding</b> will be vented to continue <b>Oxygen</b> extraction."
		#KERBALISM_BranchLoc_Transform_CarbonDioxide_into_Oxygen_and_Shieldin = Превращает <b>Углекислый газ</b> в <b>Кислород</b> и <b>Защиту</b>. // "Transform <b>CarbonDioxide</b> into <b>Oxygen</b> and <b>Shielding</b>."
		#KERBALISM_BranchLoc_Extract_LqdFluorine_from_Minerals_desc = Основное назначение этого конвертера — извлечение <b>Жидкого фтора</b> из <b>Минералов</b>. // "The primary purpose of this converter is to extract <b>LqdFluorine</b> from <b>Minerals</b>."
		#KERBALISM_BranchLoc_Extract_LqdFluorine_and_Beryllium_desc = Основное назначение этого конвертера — извлечение <b>Жидкого фтора</b> и <b>Бериллия</b> из <b>Экзотических минералов</b>. // "The primary purpose of this converter is to extract <b>LqdFluorine</b> and <b>Beryllium</b> from <b>ExoticMinerals</b>."
