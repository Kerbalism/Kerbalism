		#KERBALISM_BranchLoc_Slam_LqdDeuterium_and_LqdHe3_compress_desc = Сжимает <b>Жидкий дейтерий</b> и <b>Жидкий He-3</b> вместе под огромным давлением. // "Compress <b>LqdDeuterium</b> and <b>LqdHe3</b> together under immense pressure."
