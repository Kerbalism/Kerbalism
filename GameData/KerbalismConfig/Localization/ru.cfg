		#KERBALISM_stress_warning = $ON_VESSEL$KERBAL теряет рассудок@<i>Концентрация становится проблемой</i> // "$ON_VESSEL$KERBAL is losing $HIS_HER mind@<i>Concentration is becoming a problem</i>"
		#KERBALISM_stress_danger = $ON_VESSEL$KERBAL на грани срыва@<i>Начинает слышать голоса</i> // "$ON_VESSEL$KERBAL is about to breakdown@<i>Starting to hear voices</i>"
		#KERBALISM_stress_relax = $ON_VESSEL$KERBAL снова мыслит ясно@<i>Давайте сделаем это снова!</i> // "$ON_VESSEL$KERBAL is thinking straight now@<i>Let's do it again!</i>"

		#KERBALISM_radiation_warning = $ON_VESSEL$KERBAL подвергся интенсивному облучению // "$ON_VESSEL$KERBAL has been exposed to intense radiation"
		#KERBALISM_radiation_danger = $ON_VESSEL$KERBAL сообщает о симптомах лучевой болезни // "$ON_VESSEL$KERBAL is reporting symptoms of radiation poisoning"
		#KERBALISM_radiation_fatal = $ON_VESSEL$KERBAL умер после воздействия экстремальной радиации // "$ON_VESSEL$KERBAL died after being exposed to extreme radiation"
		#KERBALISM_radiation_relax = $ON_VESSEL$KERBAL оправился от воздействия радиации // "$ON_VESSEL$KERBAL has recovered from radiation exposure"

		#KERBALISM_low_food = Запасы еды на $VESSEL заканчиваются@<i>Всё съедобное подвергается тщательной проверке</i> // "Food reserves are getting low on $VESSEL@<i>Anything edible is being scrutinized</i>"
		#KERBALISM_empty_food = На $VESSEL больше нет еды@<i>Экипаж готовится к неизбежному</i> // "There is no more food on $VESSEL@<i>The crew prepare for the inevitable</i>"
		#KERBALISM_refill_food = Запасы еды на $VESSEL восстановлены@<i>Двойные пайки закусок для всех</i> // "$VESSEL food reserves restored@<i>Double snack rations for everybody</i>"

		#KERBALISM_low_water = Запасы воды на $VESSEL заканчиваются@<i>График гигиены приостановлен до дальнейшего уведомления</i> // "Water reserves are getting low on $VESSEL@<i>Hygiene schedule suspended until further notice</i>"
		#KERBALISM_empty_water = На $VESSEL больше нет воды@<i>Обслизывание конденсата не является жизнеспособным решением</i> // "There is no more water on $VESSEL@<i>Licking the condensate is not a viable solution</i>"
		#KERBALISM_refill_water = Запасы воды на $VESSEL восстановлены@<i>Ситуация выглядит намного лучше</i> // "$VESSEL water reserves restored@<i>The situation looks much better now</i>"

		#KERBALISM_low_oxygen = Запасы кислорода на $VESSEL опасно низки@<i>Среди экипажа лёгкая паника</i> // "Oxygen reserves are dangerously low on $VESSEL@<i>There is mild panic among the crew</i>"
		#KERBALISM_empty_oxygen = На $VESSEL больше нет кислорода@<i>Все перестают дышать</i> // "There is no more oxygen on $VESSEL@<i>Everybody stop breathing</i>"
		#KERBALISM_refill_oxygen = Запасы кислорода на $VESSEL восстановлены@<i>Экипаж переводит дух</i> // "$VESSEL oxygen reserves restored@<i>The crew is taking a breather</i>"

		#KERBALISM_low_co2 = Запасы углекислого газа на $VESSEL заканчиваются@<i>Растения на борту выглядят недовольными</i> // "Carbon dioxide reserves are getting low on $VESSEL@<i>The plants on board look unhappy</i>"
		#KERBALISM_empty_co2 = На $VESSEL больше нет углекислого газа@<i>Растения на борту подали официальную жалобу</i> // "There is no more carbon dioxide on $VESSEL@<i>The plants on board have filed a formal complaint</i>"
		#KERBALISM_refill_co2 = Запасы углекислого газа на $VESSEL восстановлены@<i>Растения на борту благодарны</i> // "$VESSEL carbon dioxide reserves restored@<i>The plants on board are grateful</i>"

		#KERBALISM_low_nitrogen = Запасы азота на $VESSEL заканчиваются@<i>Надеюсь, все взяли свои скафандры!</i> // "Nitrogen reserves are getting low on $VESSEL<i>I hope everybody brought their space suits!</i>"
		#KERBALISM_empty_nitrogen = На $VESSEL больше нет азота@<i>Время возвращаться в скафандры</i> // "There is no more nitrogen on $VESSEL@<i>Time to go back in the suits</i>"
		#KERBALISM_refill_nitrogen = Запасы азота на $VESSEL восстановлены@<i>Давайте вылезем из этих проклятых скафандров</i> // "$VESSEL nitrogen reserves restored@<i>Let's get out of these damn suits</i>"

		#KERBALISM_low_hydrogen = Баки водорода на $VESSEL почти пусты // "Hydrogen tanks are almost empty on $VESSEL"
		#KERBALISM_empty_hydrogen = В баках $VESSEL больше нет водорода // "There is no more hydrogen on $VESSEL tanks"
		#KERBALISM_refill_hydrogen = Баки водорода на $VESSEL заполнены // "$VESSEL hydrogen tanks refilled"

		#KERBALISM_low_ammonia = Баки аммиака на $VESSEL почти пусты // "Ammonia tanks are almost empty on $VESSEL"
		#KERBALISM_empty_ammonia = В баках $VESSEL больше нет аммиака@<i>Возможно, пришло время для вонючих альтернатив</i> // "There is no more ammonia in $VESSEL's tanks@<i>Maybe it's time for some smelly alternatives</i>"
		#KERBALISM_refill_ammonia = Баки аммиака на $VESSEL заполнены // "$VESSEL ammonia tanks refilled"

		#KERBALISM_low_enriched_uranium = Запасы обогащённого урана на $VESSEL заканчиваются@<i>Где этот корабль снабжения?</i> // "Enriched uranium reserves are getting low on $VESSEL@<i>Where is that resupply ship?</i>"
		#KERBALISM_empty_enriched_uranium = На борту $VESSEL больше нет обогащённого урана@<i>Планировщики миссий отменяют все высокоэнергетические операции до дальнейшего уведомления</i> // "There is no more enriched uranium onboard $VESSEL@<i>Mission planners cancel all high power activities until further notice</i>"
		#KERBALISM_refill_enriched_uranium = Запасы обогащённого урана на $VESSEL восполнены // "$VESSEL enriched uranium reserves are refilled"

		//Названия правил // "Rules name"
		#KERBALISM_RuleName_climatization = климатизация // "climatization"
		#KERBALISM_RuleName_eating = приём пищи // "eating"
		#KERBALISM_RuleName_drinking = питьё // "drinking"
		#KERBALISM_RuleName_breathing = дыхание // "breathing"
		#KERBALISM_RuleName_co2poisoning = отравление CO2 // "co2 poisoning"
		#KERBALISM_RuleName_stress = стресс // "stress"
		#KERBALISM_RuleName_radiation = радиация // "radiation"

		//Ресурсы // "Resources"
		#KERBALISM_Resource_Atmosphere = Атмосфера // "Atmosphere"
		#KERBALISM_Resource_WasteAtmosphere = Отработанная атмосфера // "WasteAtmosphere"
		#KERBALISM_Resource_Shielding = Защита // "Shielding"

		//Действия для счётчика Гейгера // "action for geigercounter"
		#KERBALISM_TakeData = Взять данные // "Take Data"
		#kerbalism_geigercounter_Part_LogRadiationData = Записать данные радиации // "Log Radiation Data"
		#kerbalism_geigercounter_Part_DiscardRadiationData = Отбросить данные радиации // "Discard Radiation Data"
		#kerbalism_geigercounter_Part_ReviewRadiationData = Просмотреть данные радиации // "Review Radiation Data"

		//Улучшения деталей для слотов // "Part Upgrade for upgradeable slots"
		#KERBALISM_Upgrade_Slots_title = Улучшение слотов систем жизнеобеспечения и химического завода // "Life support and Chemical plant slot upgrade"
		#KERBALISM_Upgrade_Slots_desc = Добавляет дополнительный настраиваемый слот в пилотируемые капсулы, модули СЖО и химические заводы // "Adds an additional configurable slot to Manned pods, ECLSS module and Chemical plants"
		#KERBALISM_Upgrade_Greenhouse1_title = Улучшение эффективности оранжереи // "Greenhouse efficiency upgrade"
		#KERBALISM_Upgrade_Greenhouse1_desc = Улучшает производство пищи в оранжерее и снижает потребление энергии лампами. // "Improves greenhouse Food output and reduces lamp power draw."
		#KERBALISM_Upgrade_Greenhouse2_title = Передовое улучшение эффективности оранжереи // "Advanced greenhouse efficiency upgrade"
		#KERBALISM_Upgrade_Greenhouse2_desc = Дополнительно улучшает производство пищи в оранжерее и снижает потребление ресурсов и энергии лампами. // "Further improves greenhouse Food output and reduces input and lamp power consumption."
		#KERBALISM_Upgrade_ColumbusShower_title = Добавить "Душ" в модуль Columbus // "Add "Shower" to Columbus module"
		#KERBALISM_Upgrade_ColumbusShower_desc = Добавляет "Душ" в лабораторный модуль Columbus. Это салфетка в упаковке. // "Add a "Shower" to Columbus laboratory module. It's a napkin in a package."
		#KERBALISM_Upgrade_KiboLaundry_title = Добавить прачечную в модуль Kibo // "Add laundry unit to the Kibo module"
		#KERBALISM_Upgrade_KiboLaundry_desc = Добавляет сложную прачечную установку в лабораторный модуль Kibo. // "Adds a sophisticated laundry unit to the Kibo laboratory module."

		// Названия/описания НАУЧНЫХ улучшений деталей // "Science PARTUPGRADE titles/descriptions"
		#KERBALISM_Upgrade_UnmannedSlot_title = Улучшение слотов для беспилотных экспериментов // "Unmanned Experiments Slot Upgrade"
		#KERBALISM_Upgrade_UnmannedSlot_desc = Добавляет дополнительный слот для экспериментов в зонды. // "Adds an additional experiment slot to Probes."
		#KERBALISM_Upgrade_OrbitalSlot_title = Улучшение слотов орбитального сканера // "Orbital Scanner Slot Upgrade"
		#KERBALISM_Upgrade_OrbitalSlot_desc = Добавляет дополнительный слот для экспериментов в орбитальный сканер. // "Adds an additional experiment slot to the Orbital Scanner."
		#KERBALISM_Upgrade_LabSlot_title = Улучшение слотов лабораторных экспериментов // "Laboratory Experiments Slot Upgrade"
		#KERBALISM_Upgrade_LabSlot_desc = Добавляет дополнительный слот для экспериментов во все лаборатории. // "Adds an additional experiment slot to all Laboratories."
		#KERBALISM_Upgrade_LabReconfigure_title = Улучшение перенастройки лаборатории // "Laboratory Reconfiguration Upgrade"
		#KERBALISM_Upgrade_LabReconfigure_desc = Позволяет перенастраивать лабораторные эксперименты в полёте или на земле опытным учёным. // "Allows Laboratory Experiments to be reconfigured in flight or on the ground by experienced scientists."
		#KERBALISM_Upgrade_SurfaceSlot_title = Улучшение слотов набора для отбора проб с поверхности // "Surface Sampling Kit Slot Upgrade"
		#KERBALISM_Upgrade_SurfaceSlot_desc = Добавляет дополнительный слот для экспериментов во все наборы для отбора проб с поверхности. // "Adds an additional experiment slot to all Surface Sampling Kits."
		#KERBALISM_Upgrade_AtmoSlot_title = Улучшение слотов атмосферной науки // "Atmospheric Science Slot Upgrade"
		#KERBALISM_Upgrade_AtmoSlot_desc = Добавляет дополнительный слот для экспериментов во все группы атмосферной науки. // "Adds an additional experiment slot to all Atmospheric Science groups."
		#KERBALISM_Upgrade_CrewedSlot_title = Улучшение слотов пилотируемых экспериментов // "Crewed Experiments Slot Upgrade"
		#KERBALISM_Upgrade_CrewedSlot_desc = Добавляет дополнительный слот для экспериментов во все детали, способные проводить пилотируемые эксперименты. // "Adds an additional experiment slot to all parts capable of hosting crewed experiments."
		#KERBALISM_Upgrade_UnderwaterSlot_title = Улучшение слотов подводной науки // "Underwater Science Slot Upgrade"
		#KERBALISM_Upgrade_UnderwaterSlot_desc = Добавляет дополнительный слот для экспериментов во все группы подводной науки. // "Adds an additional experiment slot to all Underwater Science groups."
		#KERBALISM_Upgrade_HDDCapacity_title = Улучшение ёмкости жёсткого диска // "HDD Capacity Upgrade"
		#KERBALISM_Upgrade_HDDCapacity1_desc = Инженеры поняли, что если добавить ещё один диск в накопитель, можно удвоить ёмкость! // "Engineers figured that if they add another platter to the drive, they can double the capacity!"
		#KERBALISM_Upgrade_HDDCapacity2_desc = Увеличение плотности дисков равно увеличению ёмкости! // "An increase in platter density equals an increase in capacity!"
		#KERBALISM_Upgrade_HDDCapacity3_desc = Преобразует все старые пыльные жёсткие диски в новые блестящие твердотельные накопители! // "Converts all the old dusty Hard Drives to all new and shiny Solid State Drives!"
		#KERBALISM_Upgrade_HDDCapacity4_desc = Квантово-физические фокусы! Это просто работает. Не спрашивайте как. // "Quantum physics shenenigans! It just works. Don't ask how."
		#KERBALISM_Upgrade_SampleCapacity_title = Улучшение ёмкости хранения образцов // "Sample Storage Capacity Upgrade"
		#KERBALISM_Upgrade_SampleCapacity_desc = Увеличивает общий объём хранения образцов // "Increase the total amount of sample storage"
		#KERBALISM_Upgrade_GooSampleCapacity_title = Улучшение ёмкости образцов таинственной субстанции // "Mystery Goo Sample Capacity Upgrade"
		#KERBALISM_Upgrade_GooSampleCapacity_desc = Увеличивает общий объём хранения образцов для эксперимента с субстанцией // "Increase the total amount of sample storage for the Goo Experiment"
		#KERBALISM_Upgrade_MatBaySampleCapacity_title = Улучшение ёмкости образцов материаловедческого отсека // "Materials Bay Sample Capacity Upgrade"
		#KERBALISM_Upgrade_MatBaySampleCapacity_desc = Увеличивает общий объём хранения образцов для материаловедческого отсека // "Increase the total amount of sample storage for the Materials Bay"

		//Названия настраиваемой системы жизнеобеспечения // "Configurable Life Support System title"

		#KERBALISM_Scrubber_title = Скруббер // "Scrubber"
		#KERBALISM_Scrubber_desc = Двухслойный регенеративный скруббер с вакуумной регенерацией, который удаляет <b>углекислый газ</b> из внутренней атмосферы. // "A dual-bed vacuum-exposing regenerative scrubber that sequesters <b>CarbonDioxide</b> from the internal atmosphere."
		#KERBALISM_NonRegenScrubber_title = Нерегенерирующий скруббер // "Non-Regen Scrubber"

		#KERBALISM_PressureControl_title = Контроль давления // "Pressure control"
		#KERBALISM_PressureControl_desc = Использует <b>Азот</b> для поддержания комфортного давления во внутренней атмосфере. // "Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure."

		#KERBALISM_WaterRecycler_title = Рециркулятор воды // "Water recycler"
		#KERBALISM_WaterRecycler_desc = Фильтрует примеси из <b>Сточных вод</b>. // "Filter impurities out of <b>WasteWater</b>."

		#KERBALISM_WaterElectrolysis_title = Электролиз воды // "Water electrolysis"
		#KERBALISM_WaterElectrolysis_desc = Расщепляет <b>Воду</b> на <b>Водород</b> и <b>Кислород</b>. // "Split <b>Water</b> into its <b>Hydrogen</b> and <b>Oxygen</b> components."

		#KERBALISM_WaterExcavation_title = Добыча воды // "Water Excavation"
		#KERBALISM_WaterExcavation_desc = Добывает <b>Воду</b> с поверхности. // "Extract <b>Water</b> from the surface."
		#KERBALISM_WaterExcavation_desc2 = Добывает <b>Воду</b> из океана. // "Extract <b>Water</b> from the ocean."

		#KERBALISM_WasteProcessor_title = Переработчик отходов // "Waste processor"
		#KERBALISM_WasteProcessor_desc = Извлекает <b>Аммиак</b> из разлагающихся органических <b>Отходов</b>. // "Extract <b>Ammonia</b> out of decomposing organic <b>Waste</b>."
		#KERBALISM_WasteIncinerator_title = Инсинератор отходов // "Waste incinerator"
		#KERBALISM_WasteIncinerator_desc = Производит <b>Углекислый газ</b> и <b>Воду</b> путём сжигания <b>Отходов</b> с <b>Кислородом</b>. Включает небольшой турбогенератор на выхлопе. Избыток <b>Воды</b>, <b>Углекислого газа</b> или <b>Электричества</b> может быть сброшен при необходимости. // "Produce <b>CarbonDioxide</b> and <b>Water</b> by combustion of <b>Waste</b> with <b>Oxygen</b>. Includes a small exhaust turbine generator. Excess <b>Water</b>, <b>CarbonDioxide</b> or <b>ElectricCharge</b> can be dumped as needed."
		#KERBALISM_WasteCompressor_title = Компрессор отходов // "Waste compressor"
		#KERBALISM_WasteCompressor_desc = Уплотняет <b>Отходы</b> до плотности <b>защитного материала</b>. // "Compact <b>Waste</b> to the density of <b>shielding material</b>."

		#KERBALISM_MonopropO2FuelCell_title = Топливный элемент монопроп+О2 // "Monoprop+O2 fuel cell"
		#KERBALISM_MonopropO2FuelCell_desc = Аварийный топливный элемент, сжигающий <b>Монопропеллент</b> и газообразный <b>Кислород</b>, производя <b>Воду</b> и газообразный <b>Азот</b> как побочные продукты // "An emergency fuel cell that burns <b>MonoPropellant</b> and <b>Oxygen</b> gas, producing <b>Water</b> and <b>Nitrogen</b> gas as by-products"
		#KERBALISM_MonopropO2FuelCell_desc2 = Сжигает <b>Монопропеллент</b> и газообразный <b>Кислород</b>, производя <b>Воду</b> и газообразный <b>Азот</b> как побочные продукты. // "Burns <b>MonoPropellant</b> and <b>Oxygen</b> gas, producing <b>Water</b> and <b>Nitrogen</b> gas as by-products."
		#KERBALISM_H2O2FuelCell_title = Топливный элемент H2+O2 // "H2+O2 fuel cell"
		#KERBALISM_H2O2FuelCell_desc = Сжигает газообразный <b>Водород</b> и газообразный <b>Кислород</b>, производя <b>Воду</b> как побочный продукт. // "Burns <b>Hydrogen</b> gas and <b>Oxygen</b> gas, producing <b>Water</b> as a by-product."

		#KERBALISM_Harvester_title = Добытчик // "Harvester"
		#KERBALISM_FuelCell_title = Топливный элемент // "Fuel Cell"
		#KERBALISM_FuelCell_desc = Менее эффективная, но более надёжная альтернатива солнечным панелям. Сжигает <b>Водород</b> и <b>Кислород</b> в электричество и немного <b>Воды</b>. В аварийной ситуации также может сжигать <b>Монопропеллент</b> с <b>Кислородом</b>, производя <b>Воду</b> и <b>Азот</b> как побочные продукты. Инженеры настаивают, что воду можно пить. Экипаж подал официальную жалобу. // "A less efficient, but more reliable, alternative to solar panels. Burns <b>Hydrogen</b> and <b>Oxygen</b> into ElectricCharge and a bit of <b>Water</b>. In an emergency it can also burn <b>MonoPropellant</b> with <b>Oxygen</b>, producing <b>Water</b> and <b>Nitrogen</b> as by-products. The engineers insist the water is drinkable. The crew has filed a formal complaint."

		#KERBALISM_Comfort_panorama_desc = Купол предлагает расслабляющий панорамный вид на пустоту космоса. // "The cupola offer a relaxing panoramic view of the void of space."
		#KERBALISM_Comfort_plants_desc = В искусственном кусочке природы есть что-то успокаивающее, поддерживаемое только чудесами изоленты и кербаловской инженерии. Будем надеяться, что экипаж не будет слишком много об этом думать. // "There's something inherently calming about an artificial slice of nature, kept alive only by the miracles of duct-tape and kerbal engineering. Let's hope the crew doesn't think too much about it."
		#KERBALISM_Comfort_exercise_desc = Включена беговая дорожка, разработанная для занятий в невесомости. Экипаж её полюбит. // "A treadmill designed to permit exercise in zero-g is included. The crew will love it."
		#KERBALISM_Comfort_lowg_exercise_desc = Включено некоторое оборудование для упражнений в слабой гравитации. Экипаж его полюбит. // "Some low-g exercise equipment is included. The crew will love it."
		#KERBALISM_Comfort_centrifuge_desc = Включена система вращения, имитирующая гравитацию. Экипаж её полюбит. // "It has included a rotation system that simulates gravity. The crew will love it."
		#KERBALISM_Comfort_observation_desc = Лучший опыт наблюдения за космосом. // "The very best space observation experience."
		#KERBALISM_Comfort_Treadmill_title = Беговая дорожка // "Treadmill"
		#KERBALISM_Comfort_Shower_title = Душ // "Shower"
		#KERBALISM_Comfort_Shower_desc = Это не душ - но закройте глаза и поверьте. Сухая салфетка помещается в специальную упаковку. Упаковка заполняется тёплой водой из бортового дозатора воды. Когда сухая салфетка пропитывается, астронавт вскрывает упаковку и "принимает душ" с помощью самодельной влажной салфетки. // "This is not a shower - but close your eyes and believe it. A dry napkin is placed into a special package. The package is filled with warm water from the onboard water dispenser. When the dry napkin is soaked, the astronaut breaks the package open and 'showers' with the home-made wet wipe."
		#KERBALISM_Comfort_ZeroGShower_desc = Души в космосе! Этот экспериментальный душ использует портативную бутылку с водой под давлением, подключённую к душевой лейке с кнопкой, и всасывающую головку для сбора сточных вод. Цилиндрическая стенка душа удерживает капли воды внутри агрегата. // "Showers in space! This experimental shower uses a portable pressurized bottle of water connected to a push button showerhead, and a suction head to collect waste water. A cylindrical-shaped shower wall keeps water droplets self contained within the unit."
		#KERBALISM_Comfort_Laundry_title = Прачечная // "Laundry"
		#KERBALISM_Comfort_Laundry_desc = Это сложная прачечная установка, созданная японскими инженерами. Используйте на свой страх и риск, она может превратить воду в сточные воды. // "This is a sophisticated laundry unit made by japanese engineers. Use at your own risk, it could convert water into waste water."

		#KERBALISM_Batteries_desc = Дополнительное хранилище батарей для длительных миссий. // "Extra battery storage for extended missions."

		#KERBALISM_AirPump_title = Воздушный насос // "Air Pump"
		#KERBALISM_AirPump_desc = Регулирует давление в жилом отсеке, используя наружный воздух // "Regulates habitat pressure using outside air"
		#KERBALISM_WaterPump_title = Водяной насос // "Water Pump"
		#KERBALISM_NitrogenPump_title = Азотный насос // "Nitrogen Pump"
		#KERBALISM_AmmoniaPump_title = Аммиачный насос // "Ammonia Pump"
		#KERBALISM_OxidizerPump_title = Насос окислителя // "Oxidizer Pump"

		#KERBALISM_SupplyContainer_desc = Хранит сбалансированный запас <b>Еды</b> и <b>Воды</b>. // "Store a balanced supply of <b>Food</b> and <b>Water</b>."
		#KERBALISM_SupplyContainer_desc2 = Хранит твёрдые и жидкие органические <b>Отходы</b> // "Store solid and liquid organic <b>Waste</b>"

		#KERBALISM_PressurizedTank_title = Герметичный бак // "Pressurized Tank"
		#KERBALISM_PressurizedTank_desc = Хранит сжатый газообразный <b>Кислород</b> под давлением 200 бар. // "Store pressurized <b>Oxygen</b> gas @ 200 bar."
		#KERBALISM_PressurizedTank_desc2 = Хранит сжатый газообразный <b>Азот</b> под давлением 180 бар. // "Store pressurized <b>Nitrogen</b> gas @ 180 bar."
		#KERBALISM_PressurizedTank_desc3 = Хранит сжатый газообразный <b>Водород</b> под давлением 700 бар. // "Store pressurized <b>Hydrogen</b> gas @ 700 bar."
		#KERBALISM_PressurizedTank_desc4 = Хранит сжатый газообразный <b>Аммиак</b> под давлением 35 бар. // "Store pressurized <b>Ammonia</b> gas @ 35 bar."
		#KERBALISM_PressurizedTank_desc5 = Хранит сжатый газообразный <b>Углекислый газ</b> под давлением 60 бар. // "Store pressurized <b>Carbon dioxide</b> gas @ 60 bar."
		#KERBALISM_PressurizedTank_desc6 = Хранит сжатый газообразный <b>Ксенон</b> под давлением 85 бар. // "Store pressurized <b>Xenon</b> gas @ 85 bar."

		#KERBALISM_PowerSupply_title = Питание // "Power supply"
		#KERBALISM_SabatierProcess_title = Процесс Сабатье // "Sabatier process"
		#KERBALISM_SabatierProcess_desc = <b>Водород</b> и <b>Углекислый газ</b> реагируют с никелевым катализатором с образованием <b>Воды</b> и <b>Жидкого топлива</b>. // "<b>Hydrogen</b> and <b>CarbonDioxide</b> react with a nickel catalyst to produce <b>Water</b> and <b>LiquidFuel</b>."

		#KERBALISM_HaberProcess_title = Процесс Габера // "Haber process"
		#KERBALISM_HaberProcess_desc = Производит <b>Аммиак</b> путём фиксации <b>Азота</b>. // "Produce <b>Ammonia</b> by <b>Nitrogen</b> fixation."

		#KERBALISM_AnthraquinoneProcess_title = Процесс антрахинона // "Anthraquinone process"
		#KERBALISM_AnthraquinoneProcess_desc = Синтезирует <b>Окислитель</b> с использованием окислительно-восстановительной реакции <b>Кислорода</b> и <b>Водорода</b>. // "Synthesize <b>Oxidizer</b> using a redox of <b>Oxygen</b> and <b>Hydrogen</b>."

		#KERBALISM_OxidizerDecomposition_title = Разложение окислителя // "Oxidizer decomposition"
		#KERBALISM_OxidizerDecomposition_desc = Разлагает <b>Окислитель</b> на <b>Воду</b> и <b>Кислород</b> с помощью катализатора из йодида калия. // "Break down <b>Oxidizer</b> into <b>Water</b> and <b>Oxygen</b> with a potassium iodide catalyst."

		#KERBALISM_HydrazineProduction_title = Производство гидразина // "Hydrazine production"
		#KERBALISM_HydrazineProduction_desc = <b>Окислитель</b> и <b>Аммиак</b> реагируют с образованием <b>Монопропеллента</b>, <b>Кислорода</b> и <b>Воды</b>. // "<b>Oxidizer</b> and <b>Ammonia</b> react to produce <b>MonoPropellant</b>, <b>Oxygen</b> and <b>Water</b>."
		#KERBALISM_HydrazineProductionN2_title = Производство гидразина N2 // "Hydrazine production N2"
		#KERBALISM_HydrazineProductionN2_desc = <b>Окислитель</b> и <b>Аммиак</b> с инъекцией <b>Азота</b> реагируют с образованием <b>Монопропеллента</b> и <b>Кислорода</b>. // "<b>Oxidizer</b> and <b>Ammonia</b> with <b>Nitrogen</b> injection react to produce <b>MonoPropellant</b> and <b>Oxygen</b>."

		#KERBALISM_RTG_title = РИТЭГ // "RTG"

		#KERBALISM_MoltenRegolithElectrolysis_title = МРЭ // "MRE"
		#KERBALISM_MoltenRegolithElectrolysis_desc = Извлекает <b>Кислород</b>, <b>Углекислый газ</b> и <b>Защиту</b> из <b>Руды</b>. При необходимости <b>Углекислый газ</b> и/или <b>Защита</b> будут стравиваться для продолжения добычи <b>Кислорода</b>. // "Extract <b>Oxygen</b>, <b>CarbonDioxide</b> and <b>Shielding</b> out of <b>Ore</b>. If needed <b>CarbonDioxide</b> and/or <b>Shielding</b> will be vented in order to continue the <b>Oxygen</b> extraction."

		#KERBALISM_SolidOxideElectrolysis_title = ТОЭ // "SOE"
		#KERBALISM_SolidOxideElectrolysis_desc = Превращает <b>Углекислый газ</b> в <b>Кислород</b> и <b>Защиту</b>. // "Transform <b>CarbonDioxide</b> into <b>Oxygen</b> and <b>Shielding</b>."

		#KERBALISM_SelectiveCatalyticOxidation_title = СКО // "SCO"
		#KERBALISM_SelectiveCatalyticOxidation_desc = <b>Аммиак</b> и <b>Кислород</b> реагируют с катализатором, подобным гидроталькиту, с образованием <b>Азота</b> и <b>Воды</b>. // "<b>Ammonia</b> and <b>Oxygen</b> react with a hydrotalcite-like catalyst to produce <b>Nitrogen</b> and <b>Water</b>."

		#KERBALISM_ChemicalPlant_title = Химический завод // "Chemical Plant"
		#KERBALISM_OreExcavation_title = Добыча руды // "Ore Excavation"
		#KERBALISM_OreExcavation_desc = Добывает <b>Руду</b> с поверхности. // "Extract <b>Ore</b> from the surface."

		#KERBALISM_SpaceObjectOreExcavation_title = Добыча руды с космических объектов // "Space Object Ore Excavation"
		#KERBALISM_SpaceObjectOreExcavation_desc = Добывает <b>Руду</b> из астероидов и комет. // "Extract <b>Ore</b> from asteroids and comets."
		#KERBALISM_NitrogenExcavation_title = Добыча азота // "Nitrogen Excavation"
		#KERBALISM_NitrogenExcavation_desc = Добывает <b>Азот</b> с поверхности. // "Extract <b>Nitrogen</b> from the surface."
		#KERBALISM_NitrogenExcavation_desc2 = Добывает <b>Азот</b> из океана. // "Extract <b>Nitrogen</b> from the ocean."

		#KERBALISM_AmmoniaExtraction_desc = Добывает <b>Аммиак</b> из океана. // "Extract <b>Ammonia</b> from the ocean."
		#KERBALISM_OxidizerExtraction_desc = Добывает <b>Окислитель</b> из океана. // "Extract <b>Oxidizer</b> from the ocean."

		#KERBALISM_CO2Filter_title = Фильтр CO2 // "CO2 Filter"
		#KERBALISM_CO2Filter_desc = Извлекает <b>CO2</b> из атмосферы. // "Extract <b>CO2</b> from the atmosphere."
		#KERBALISM_OxygenFilter_title = Фильтр кислорода // "Oxygen Filter"
		#KERBALISM_OxygenFilter_desc = Извлекает <b>Кислород</b> из атмосферы. // "Extract <b>Oxygen</b> from the atmosphere."
		#KERBALISM_NitrogenFilter_title = Фильтр азота // "Nitrogen Filter"
		#KERBALISM_NitrogenFilter_desc = Извлекает <b>Азот</b> из атмосферы. // "Extract <b>Nitrogen</b> from the atmosphere."
		#KERBALISM_AmmoniaFilter_title = Фильтр аммиака // "Ammonia Filter"
		#KERBALISM_AmmoniaFilter_desc = Извлекает <b>Аммиак</b> из атмосферы. // "Extract <b>Ammonia</b> from the atmosphere."

		#KERBALISM_None_title = Нет // "None"
		#KERBALISM_None_desc = Пустой слот для экономии массы и стоимости. // "Empty slot for mass and cost savings."
		#KERBALISM_None_experiments_desc = Пустой слот для экономии массы и стоимости, если вам не требуются установленные эксперименты. // "Empty slot for mass and cost savings, should you not require any experiments installed."
		#KERBALISM_None_instruments_desc = Пустой слот для экономии массы и стоимости, если вам не требуются установленные приборы. // "Empty slot for mass and cost savings, should you not require any instruments installed."

		#KERBALISM_Habitat_UnpressurizedTitle = :$: (БЕЗ НАДДУВА) : // ": $: (UNPRESSURIZED) :"
		#KERBALISM_Habitat_UnpressurizedDesc = :$:\n\n<color=orange>Без наддува.</color> Берите свой скафандр. : // ": $:\n\n<color=orange>Unpressurized.</color> Bring your own space suit. :"

		#KERBALISM_Sickbay_Modules_title = Модули лазарета // "Sickbay Modules"
		#KERBALISM_Sickbay_RDU_title = Блок детоксикации от радиации // "Radiation Detoxication Unit"
		#KERBALISM_Sickbay_RDU_short = БДР // "RDU"
		#KERBALISM_Sickbay_RDU_desc = Блок детоксикации от радиации (БДР) использует <b>Э/Э</b> и <b>Кислород</b> для снижения последствий лучевой болезни. // "The Radiation Detoxication Unit (RDU) uses <b>EC</b> and <b>Oxygen</b> to reduce the effects of radiation poisoning."
		#KERBALISM_Sickbay_TV_title = Успокаивающий Вихрь (УВ) // "Tranquilizing Vortex (TV)"
		#KERBALISM_Sickbay_TV_short = УВ // "TV"
		#KERBALISM_Sickbay_TV_desc = Успокаивающий вихрь (УВ) использует низкокачественные отвлекающие факторы, чтобы погрузить экипаж в состояние апатии. Также снимает некоторый стресс, слухи о воздействии на тупость считаются вымыслом. // "A tranquilizing vortex (TV) uses low quality distraction to put the crew into a state of apathy. It also relieves some of the stress, effects on dumbness are said to be hearsay."

