		#KERBALISM_EXPERIMENT_Radiation_default = 天哪,这些读数太惊人了！
		#KERBALISM_EXPERIMENT_Radiation_MohoSrfLanded = 盖革计数器同意Moho有熔岩会更冷. 航天中心已经通知你, 严禁与盖革计数器交流.
		#KERBALISM_EXPERIMENT_Radiation_EveSrfLanded = 看来在Eve的地面上,高辐射是你不必担心的一件事.
		#KERBALISM_EXPERIMENT_Radiation_GillySrfLanded = 你在上面蹦来蹦去, 玩得太开心了, 没法检查辐射水平.
		#KERBALISM_EXPERIMENT_Radiation_KerbinSrfLanded = 在Kerbin上辐射值是相当正常的.一定有什么东西挡住了辐射.
		#KERBALISM_EXPERIMENT_Radiation_MunSrfLanded = Mun地面的辐射相当高，任何未来建造的居住区都需要更多的屏蔽材料.
		#KERBALISM_EXPERIMENT_Radiation_MinmusSrfLanded = 看到显示的辐射剂量, 你后悔尝了Minmus.
		#KERBALISM_EXPERIMENT_Radiation_DunaSrfLanded = 这些结果对Duna殖民地的发展至关重要.如果他们出了什么事那可太丢人了...
		#KERBALISM_EXPERIMENT_Radiation_IkeSrfLanded = 地表上含有微量的放射性化合物，研发中心相信这些元素是太阳风和Duna大气的相互作用产生的.
		#KERBALISM_EXPERIMENT_Radiation_DresSrfLanded = 将这些结果与表面样品对照, Dres似乎包含了大量的重金属和放射性金属.
		#KERBALISM_EXPERIMENT_Radiation_LaytheSrfLanded = Laythe的大气层和活动的地核保护了它的表面免受Jool强辐射带的影响, 但是背景辐射明显还是高于Kerbin
		#KERBALISM_EXPERIMENT_Radiation_VallSrfLanded = Vall的轨道很幸运没处在Jool的辐射带上, 但表面的辐射仍然很明显.
		#KERBALISM_EXPERIMENT_Radiation_TyloSrfLanded = Tylo所拥有的磁层功能足以保护这颗星球免受大部分的来自Jool辐射的影响, 但它缺乏大气层意味着仍然有大量辐射会到达地表
		#KERBALISM_EXPERIMENT_Radiation_BopSrfLanded = 航天中心发来警告,不要试图去探究他们在轨道上发现的强辐射源.
		#KERBALISM_EXPERIMENT_Radiation_PolSrfLanded = 看来Pol含有大量放射性氢和氦同位素, 来自几千年前的Jool沉积下来的.
		#KERBALISM_EXPERIMENT_Radiation_EelooSrfLanded = 在离太阳这么远的地方, 还是有如此多的的星际辐射到达了地表.这在未来将是一个学习的好地方.

		#KERBALISM_EXPERIMENT_Radiation_EveFlyingLow = Eve厚厚的大气层和巨大的磁层阻止了所有的辐射到达这个高度.
		#KERBALISM_EXPERIMENT_Radiation_KerbinFlyingLow = 火箭的震动使刻度盘不可读, 所以你决定自己写个结果.
		#KERBALISM_EXPERIMENT_Radiation_DunaFlyingLow = 大气似乎阻挡了比最初预测的更多的辐射. 这对未来的Duna任务来说是个好兆头.
		#KERBALISM_EXPERIMENT_Radiation_JoolFlyingLow = 你查看了盖革计数器, 但它拒绝显示读数, 直到你把它带出大气层.
		#KERBALISM_EXPERIMENT_Radiation_LaytheFlyingLow = 下面的海洋发出了意想不到的辐射量.
		#KERBALISM_EXPERIMENT_Radiation_EveFlyingHigh = 你忙于控制载具不让自己在空气中燃烧殆尽, 无暇查看盖革计数器.
		#KERBALISM_EXPERIMENT_Radiation_KerbinFlyingHigh = 大气吸收了大部分的辐射, 即使在高层.
		#KERBALISM_EXPERIMENT_Radiation_DunaFlyingHigh = 这里的大气正在发射大量的电离粒子.
		#KERBALISM_EXPERIMENT_Radiation_JoolFlyingHigh = 航天中心向你保证你的第三只眼睛是完全正常的.
		#KERBALISM_EXPERIMENT_Radiation_LaytheFlyingHigh = 当Jool的辐射轰击Laythe的大气层时, 会产生有趣的副产品
		#KERBALISM_EXPERIMENT_Radiation_SunInSpaceLow = 读数超过9000!!!
		#KERBALISM_EXPERIMENT_Radiation_MohoInSpaceLow = 研发中心告知你这些结果有助于取得科学上的突破. 但你死死抱着空调完全不予理会.
		#KERBALISM_EXPERIMENT_Radiation_EveInSpaceLow = Eve的大气层会释放出奇怪的离子, 会打乱你的读数.
		#KERBALISM_EXPERIMENT_Radiation_GillyInSpaceLow = 由于Gilly轨道的离心率和Eve的磁层, 这里的辐射读数在不停地变化.
		#KERBALISM_EXPERIMENT_Radiation_KerbinInSpaceLow = 那里的辐射环境比我们想象的要复杂得多. 这应该会给研发中心一些新的东西来研究.
		#KERBALISM_EXPERIMENT_Radiation_MunInSpaceLow = 当你通过Mun的暗面时你注意到有一个稳定的辐射脉冲. 那可能什么也不是.
		#KERBALISM_EXPERIMENT_Radiation_MinmusInSpaceLow = 结果表明, Minmus冰壳中含有大量放射性物质.
		#KERBALISM_EXPERIMENT_Radiation_DunaInSpaceLow = 太阳正在剥离Duna脆弱的大气层, 因为Duna正在释放出一股电离粒子流.
		#KERBALISM_EXPERIMENT_Radiation_IkeInSpaceLow = Ike的近地轨道和潮汐锁定状态意味着当你在Ike面向Duna的一侧上方时, 辐射水平会大幅下降.
		#KERBALISM_EXPERIMENT_Radiation_DresInSpaceLow = 盖革计数器已经检测到大量来自Dres的辐射.
		#KERBALISM_EXPERIMENT_Radiation_JoolInSpaceLow = 航天中心建议您不要回来，以免污染其他坎巴拉人
		#KERBALISM_EXPERIMENT_Radiation_LaytheInSpaceLow = 当你俯视下面美丽的海洋时, 你忘记了你正慢慢死于辐射中毒.
		#KERBALISM_EXPERIMENT_Radiation_VallInSpaceLow = 令人惊讶的是, 辐射水平在一个合理的水平.
		#KERBALISM_EXPERIMENT_Radiation_TyloInSpaceLow = Tylo微妙的磁气圈起到了发电机的作用, 放大了Jool已经很强的辐射场.
		#KERBALISM_EXPERIMENT_Radiation_BopInSpaceLow = Bop的辐射量异常高, 似乎指向北纬68度, 东经114度. 真奇怪
		#KERBALISM_EXPERIMENT_Radiation_PolInSpaceLow = Pol周围的空间充满了放射性离子, 不幸的是, 这些离子被Jool的磁层捕获了.
		#KERBALISM_EXPERIMENT_Radiation_EelooInSpaceLow = 研发中心希望能研究关于大量星际辐射对Eeloo表面的影响.
		#KERBALISM_EXPERIMENT_Radiation_SunInSpaceHigh = 刚刚航天中心告诉你, 他们*可能*忘记给你的载具添加屏蔽材料了.
		#KERBALISM_EXPERIMENT_Radiation_MohoInSpaceHigh = 在你的旅途中, 太阳的辐射急剧增加.
		#KERBALISM_EXPERIMENT_Radiation_EveInSpaceHigh = 你不是很想穿过Eve的辐射带.
		#KERBALISM_EXPERIMENT_Radiation_GillyInSpaceHigh = 你拒绝检查辐射水平, 除非航天中心停止说土豆的双关语.
		#KERBALISM_EXPERIMENT_Radiation_KerbinInSpaceHigh = 这里很危险.
		#KERBALISM_EXPERIMENT_Radiation_MunInSpaceHigh = 你穿过了Kerbin的辐射带, 但没死. 你现在担心这会催生出一堆疯狂的阴谋论.
		#KERBALISM_EXPERIMENT_Radiation_MinmusInSpaceHigh = 你看到这上面显示不正常的辐射量, 却不知道它的来源.
		#KERBALISM_EXPERIMENT_Radiation_DunaInSpaceHigh = Duna似乎没有磁层, 所以宇宙辐射将是未来Duna任务的一个问题.
		#KERBALISM_EXPERIMENT_Radiation_IkeInSpaceHigh = 出乎意料的是，Ike似乎有足够的磁场来扰乱在Duna大气中剥离出来的离子
		#KERBALISM_EXPERIMENT_Radiation_DresInSpaceHigh = 在这个小行星上, 当你意识到你忘记带盖革计数器的时候, 你忍不住捂住脸哭了起来.
		#KERBALISM_EXPERIMENT_Radiation_JoolInSpaceHigh = 从Jool发出的辐射量是惊人的, 你开始希望自己是在进行Duna探索任务.
		#KERBALISM_EXPERIMENT_Radiation_LaytheInSpaceHigh = 令人难以置信的是, Laythe对Jool的辐射带的攻击有很大的抵抗力.上帝保佑着Laythe. 上帝保佑.
		#KERBALISM_EXPERIMENT_Radiation_VallInSpaceHigh = 尽管Vall不在主辐射带内，但它仍然受到Jool辐射的恶毒惩罚.
		#KERBALISM_EXPERIMENT_Radiation_TyloInSpaceHigh = 来自Jool的辐射在Tylo周围形成了一条强烈的辐射带, 但幸运的是, 看起来并没有很多辐射到达地表. 但注意,"很多"是相对而言.
		#KERBALISM_EXPERIMENT_Radiation_BopInSpaceHigh = 实际上, Bop似乎是一个很强的辐射源, 但在Jool的辐射场中, 它的辐射就显得微不足道了.
		#KERBALISM_EXPERIMENT_Radiation_PolInSpaceHigh = Pol离Jool足够远, 它接收来自Jool磁层和行星际气体的电离同位素.
		#KERBALISM_EXPERIMENT_Radiation_EelooInSpaceHigh = 随着太阳的影响减弱, 星际辐射变得更加明显. 整个星系的秘密向你敞开.
