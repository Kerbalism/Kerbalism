      - Settings: tech-guide/settings.md
      - Profile: tech-guide/profile.md
      - MM patch injection: tech-guide/mm-patch-injection.md
      - Background simulation: tech-guide/background-simulation.md
      - Radiation: tech-guide/radiation.md
      - Supporting Science Mods: tech-guide/supporting-science-mods.md
      - "C# API": tech-guide/csharp-api.md
      - PartModules:
          - Overview: tech-guide/part-modules/index.md
          - Crew Specifications: tech-guide/part-modules/crew-specifications.md
          - Comfort: tech-guide/part-modules/comfort.md
          - Configure: tech-guide/part-modules/configure.md
          - Emitter: tech-guide/part-modules/emitter.md
          - ECDrainViaPM: tech-guide/part-modules/ecdrainviapm.md
          - Experiment: tech-guide/part-modules/experiment.md
          - GravityRing: tech-guide/part-modules/gravityring.md
          - Greenhouse: tech-guide/part-modules/greenhouse.md
          - Habitat: tech-guide/part-modules/habitat.md
          - HardDrive: tech-guide/part-modules/harddrive.md
          - Harvester: tech-guide/part-modules/harvester.md
          - Laboratory: tech-guide/part-modules/laboratory.md
          - PassiveShield: tech-guide/part-modules/passiveshield.md
