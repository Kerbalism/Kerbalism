// Adapted for Kerbalism packaging and upstream-Extra coexistence.
// Ion engine patch
@PART[ionArgon-0625]:FOR[KerbalismSystemHeatCompat]:NEEDS[Kerbalism,SystemHeat,!SystemHeatIonEngines]
{
  MODULE
  {
    name = ModuleSystemHeat
    volume = 0.15
    moduleID = engine
    iconName = Icon_Engine
  }

   @MODULE[ModuleEngines*],*
  {
    @heatProduction = 0
  }
  MODULE
  {
    name = ModuleSystemHeatEngine
    // must be unique
    moduleID = engine
    // ModuleSystemHeat to link to
    systemHeatModuleID = engine

    engineModuleID = FissionFragment
    // in KW at  peak output
    systemPower = 1.25
    // Nominal system output temperature
    systemOutletTemperature = 350

    // Valid system temperature range
    temperatureCurve
    {
        key = 0 1.0
        key = 350 1.0
        key = 500 0.0
    }
    shutdownTemperature = 500
  }
}
