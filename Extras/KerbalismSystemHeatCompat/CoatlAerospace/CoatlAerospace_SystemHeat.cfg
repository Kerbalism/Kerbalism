// ============================================================================
// KerbalismSystemHeatCompat: Coatl Aerospace (ProbesPlus) radiators
// ============================================================================
// Convert stock ModuleActiveRadiator cooling to ModuleSystemHeatRadiator so these
// parts reject heat on SystemHeat loops. Peak kW follows SystemHeat's usual
// stock scaling: maxEnergyTransfer / 50 at 400 K (low-temp radiators).
//
// Parts:
//   ca_louver_s / ca_louver_s2 / ca_louver_m  — Thermal Control Louvers
//   ca_ESM                                   — Quetzal Extended Service Module
//   ca_vor_sp / ca_vor_sp2                   — Vorona solar-thermal wings
// ============================================================================

// TCL4 — mass 0.01, maxEnergyTransfer 2500 → 50 kW @ 400 K
@PART[ca_louver_s]:HAS[@MODULE[ModuleActiveRadiator]]:NEEDS[Kerbalism,SystemHeat]:FOR[KerbalismSystemHeatCompat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.02
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}

	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		systemHeatModuleID = default
		maxRadiatorTemperature = 350
		emissivity = 0.9
		temperatureCurve
		{
			key = 0 0
			key = 400 50
		}
		convectiveArea = 0.25
	}
}

// TCL4-B — same MET as TCL4
@PART[ca_louver_s2]:HAS[@MODULE[ModuleActiveRadiator]]:NEEDS[Kerbalism,SystemHeat]:FOR[KerbalismSystemHeatCompat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.02
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}

	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		systemHeatModuleID = default
		maxRadiatorTemperature = 350
		emissivity = 0.9
		temperatureCurve
		{
			key = 0 0
			key = 400 50
		}
		// Slightly larger area than TCL4 (longer body)
		convectiveArea = 0.35
	}
}

