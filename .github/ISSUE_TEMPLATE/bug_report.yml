name: Bug report
description: Something is broken or behaves incorrectly.
title: "[Bug]: "
labels: ["bug", "unconfirmed"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please read [How to Report Bugs](https://github.com/Kerbalism/Kerbalism/blob/master/CONTRIBUTING.md#how-to-report-bugs) first.
        Reproduce with the **minimal** mod set whenever possible (ideally Kerbalism + ModuleManager only).

  - type: input
    id: kerbalism-version
    attributes:
      label: Kerbalism version
      description: From `GameData/Kerbalism/Kerbalism.version`, or the CKAN / release version.
      placeholder: e.g. 3.40
    validations:
      required: true

  - type: input
    id: ksp-version
    attributes:
      label: KSP version
      placeholder: e.g. 1.12.5
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Kerbalism?
      options:
        - CKAN
        - Manual / GitHub release
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Mods required to reproduce
      description: List every mod (and version) still installed when the bug occurs. Prefer a minimal set.
      placeholder: |
        - Kerbalism 3.40
        - ModuleManager 4.2.3
        - (only mods needed to reproduce)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps someone else can follow.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include screenshots if useful.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach or link `KSP.log` / `output_log.txt` (from `KSP_x64_Data` or `KSP_Data`).
        Zip attachments are fine. Pastebin / similar links also work.
      placeholder: Attach the log file to this issue, or paste a link here.
    validations:
      required: true

  - type: textarea
    id: craft-save
    attributes:
      label: Craft / quicksave (optional)
      description: |
        If the bug needs a specific vessel or situation, attach a craft file and/or quicksave.
        Prefer stock parts so maintainers can load it. Include short load/use instructions.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I tried to reproduce with a minimal mod list (see CONTRIBUTING.md)
          required: true
        - label: I attached or linked a relevant log file
          required: true
